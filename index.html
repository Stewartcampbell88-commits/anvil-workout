<!DOCTYPE html>
<html lang="en">

  <style>
    :root {

    .block { color:var(--primary); font-size:0.75rem; font-weight:700; letter-spacing:0.16em; text-transform:uppercase; margin:1rem 0 0.5rem; }
    .panel { background:var(--surface); border-radius:1rem; padding:1rem; margin-top:0.75rem; box-shadow:0 0 0 1px rgb(243 243 243 / 0.08); }

    .rest-box { background:var(--inset); border-radius:0.75rem; padding:0.75rem; margin-top:0.75rem; text-align:center; }

    .set-hit { width:100%; min-height:3.25rem; border-radius:0.75rem; background:var(--border); font-size:1.25rem; font-weight:700; font-variant-numeric:tabular-nums; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:0.35rem 0.2rem; line-height:1.1; touch-action:manipulation; -webkit-user-select:none; user-select:none; }

    .logo { width:1.5rem; height:1.5rem; color:var(--primary); flex-shrink:0; }

    .rm button { color:var(--muted); min-height:2.75rem; padding:0 0.5rem; font-size:0.875rem; font-weight:700; }
    .tiny { font-size:0.75rem; font-weight:700; letter-spacing:0.16em; text-transform:uppercase; color:var(--muted); }
    .space { margin-top:0.75rem; }
    .help { background:var(--inset); border-radius:1rem; padding:0.75rem 1rem; margin-top:0.75rem; font-size:0.875rem; color:var(--muted); line-height:1.45; }

    .vol-row { display:flex; align-items:center; gap:0.75rem; margin-top:0.5rem; }

    .cue-list { display:grid; gap:0.5rem; margin-top:0.5rem; }
    .settings-sheet { position:fixed; inset:0; z-index:30; background:var(--bg); display:flex; flex-direction:column; padding:max(0.75rem, env(safe-area-inset-top)) 1rem max(1.5rem, env(safe-area-inset-bottom)); }
    .settings-sheet-inner { max-width:28rem; margin:0 auto; width:100%; flex:1; min-height:0; display:flex; flex-direction:column; }

    .settings-head h2 { margin:0; font-size:1.25rem; letter-spacing:0.04em; }
    .settings-body { flex:1; min-height:0; display:flex; flex-direction:column; padding:0.75rem 0 0; overflow:hidden; }
    .settings-layout { display:flex; gap:0.75rem; flex:1; min-height:0; }

    .settings-nav button.on { background:var(--primary); color:var(--primary-fg); }
    .settings-detail { flex:1; min-width:0; overflow-y:auto; -webkit-overflow-scrolling:touch; padding-bottom:1rem; }

    .bw-num { font-family:var(--display); font-size:3.5rem; font-weight:700; font-variant-numeric:tabular-nums; line-height:1; min-width:5rem; text-align:center; }
    .bw-unit { font-size:1.125rem; font-weight:700; color:var(--muted); margin-left:0.25rem; }
    .bw-step-row { display:flex; align-items:center; justify-content:center; gap:0.75rem; margin:1.25rem 0; }
    .bw-step-row .icon-btn { width:3.25rem; height:3.25rem; font-size:1.5rem; font-weight:700; }
    .progress-select { width:100%; min-height:2.75rem; border-radius:0.75rem; padding:0 0.75rem; font:inherit; font-weight:600; background:var(--border); color:var(--fg); border:0; margin-top:0.5rem; }
    svg.chart-svg { width:100%; height:auto; display:block; stroke:none; fill:none; }
    .chart-empty { color:var(--muted); font-size:0.875rem; margin:0.75rem 0 0; }
    .seg { display:flex; gap:0.25rem; background:var(--inset); border-radius:0.75rem; padding:0.25rem; box-shadow:0 0 0 1px rgb(243 243 243 / 0.08); }
    .seg button { flex:1; min-height:2.25rem; border-radius:0.5rem; font-size:0.75rem; padding:0 0.125rem; white-space:nowrap; font-weight:700; color:var(--muted); }
    .seg button.on { background:var(--primary); color:var(--primary-fg); }
    .chart-head { display:flex; align-items:baseline; justify-content:space-between; gap:0.5rem; }
    .chart-unit { font-size:0.8125rem; font-weight:700; color:var(--muted); }
    .stat-row { display:grid; grid-template-columns:repeat(3,1fr); gap:0.375rem; margin:0.625rem 0 0.5rem; }
    .stat { background:var(--inset); border-radius:0.625rem; padding:0.375rem 0.5rem; display:flex; flex-direction:column; min-width:0; }
    .stat-lab { font-size:0.625rem; letter-spacing:0.08em; text-transform:uppercase; color:var(--muted); }
    .stat-val { font-family:var(--display); font-size:1.0625rem; font-weight:700; font-variant-numeric:tabular-nums; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .chart-read { margin:0.375rem 0 0; font-size:0.8125rem; font-weight:600; min-height:1.2em; }
    .chart-legend { margin:0.375rem 0 0; font-size:0.6875rem; color:var(--muted); display:flex; align-items:center; gap:0.3rem; flex-wrap:wrap; }
    .lg-line { display:inline-block; width:0.9rem; height:2px; background:var(--primary); }
    .lg-dash { display:inline-block; width:0.9rem; border-top:2px dashed rgb(243 243 243 / 0.55); margin-left:0.4rem; }
    .lg-dot { display:inline-block; width:0.5rem; height:0.5rem; border-radius:999px; background:var(--primary); margin-left:0.3rem; }
    .lg-dot:first-child { margin-left:0; }
    .lg-dot.hollow { background:transparent; box-shadow:inset 0 0 0 1.5px var(--primary); }
    .lg-dot.pr { background:transparent; box-shadow:inset 0 0 0 2px var(--done); }
    .chart-hit { cursor:pointer; }
    .headline { display:flex; flex-direction:column; margin:0.5rem 0 0.375rem; }
    .hl-val { font-family:var(--display); font-size:2rem; font-weight:700; line-height:1.05; font-variant-numeric:tabular-nums; }
    .hl-val small { font-size:0.9rem; color:var(--muted); }
    .hl-sub { font-size:0.75rem; color:var(--muted); margin-top:0.125rem; }

    .card.collapsed { padding:0.75rem 1rem; }
    .card.collapsed.pass { box-shadow:0 0 0 1px var(--done); }
    .card.collapsed.fail { box-shadow:0 0 0 1px var(--fail); }
    .ex-toggle { width:100%; display:flex; align-items:center; justify-content:space-between; gap:0.75rem; text-align:left; min-height:2.5rem; padding:0; border-radius:0.5rem; }
    .ex-toggle h2 { margin:0; font-size:1.125rem; line-height:1.3; }
    .ex-status { width:0.7rem; height:0.7rem; border-radius:999px; flex-shrink:0; }
    .ex-status.pass { background:var(--done); }
    .ex-status.fail { background:var(--fail); }
    .ex-status.skipped { background:var(--muted); }
    .card.ex-flash { animation:ex-flash 0.85s ease; }
    @keyframes ex-flash {
      0%,100% { box-shadow:0 0 0 1px rgb(243 243 243 / 0.08); }
      35% { box-shadow:0 0 0 2px var(--primary); }

    .tab-bar { position:fixed; left:0; right:0; bottom:0; z-index:25; display:flex; gap:0.375rem; padding:0.5rem 1rem max(0.5rem, env(safe-area-inset-bottom)); background:var(--bg); border-top:1px solid var(--border); max-width:28rem; margin:0 auto; }
    .tab-bar button { flex:1; min-height:2.75rem; border-radius:0.75rem; font-size:0.875rem; font-weight:700; background:var(--border); display:flex; align-items:center; justify-content:center; gap:0.4rem; color:var(--fg); }
    .tab-bar button.on { background:var(--primary); color:var(--primary-fg); }
    .tab-bar svg { width:1rem; height:1rem; }
    main.has-tabs { padding-bottom: max(5.5rem, calc(env(safe-area-inset-bottom) + 4.5rem)); }
    .danger { background:var(--fail); color:#fff; }
    .walk-cta { width:100%; min-height:3.5rem; border-radius:1rem; font-size:1.25rem; font-weight:700; margin-top:0.75rem; display:flex; align-items:center; justify-content:center; }
    .walk-week { display:flex; gap:0.375rem; margin-top:0.75rem; }
    .walk-day { flex:1; min-height:2.75rem; border-radius:0.75rem; background:var(--border); display:flex; flex-direction:column; align-items:center; justify-content:center; gap:0.15rem; padding:0.35rem 0.15rem; }
    .walk-day.on { background:var(--done); color:var(--bg); }
    .walk-day .wd { font-size:0.65rem; font-weight:700; letter-spacing:0.04em; text-transform:uppercase; opacity:0.75; line-height:1; }
    .walk-day .wd-dot { width:0.45rem; height:0.45rem; border-radius:999px; background:currentColor; opacity:0.35; }
    .walk-day.on .wd-dot { opacity:1; }
    .walk-hist { display:grid; gap:0.375rem; margin-top:0.75rem; }
    .walk-row { display:flex; align-items:center; justify-content:space-between; gap:0.75rem; min-height:3rem; background:var(--inset); border-radius:0.75rem; padding:0.5rem 0.75rem; }
    .walk-row strong { font-size:0.9375rem; font-weight:700; }
    .walk-geo { color:var(--warn); font-size:0.875rem; margin:0.75rem 0 0; text-align:center; }
    .walk-readout { text-align:center; padding:1.5rem 1rem; }
    .walk-readout .big { margin:0.25rem 0 0; }
    .ex-name { cursor:pointer; text-decoration:underline dotted rgb(243 243 243 / 0.35); text-underline-offset:0.25em; text-decoration-thickness:1.5px; border-radius:0.25rem; }
    .ex-name:focus-visible { outline:2px solid var(--primary); outline-offset:2px; }
    .ex-info { display:inline-flex; align-items:center; justify-content:center; width:1.05rem; height:1.05rem; margin-left:0.35rem; border-radius:999px; border:1.5px solid var(--primary); color:var(--primary); font-size:0.65rem; font-weight:800; font-style:normal; vertical-align:0.12em; text-decoration:none; line-height:1; }
    #howto { display:none; }
    #howto.on { display:block; position:fixed; inset:0; z-index:35; }
    .ht-back { position:absolute; inset:0; background:rgb(0 0 0 / 0.6); animation:htFade .18s ease-out; }
    .ht-sheet { position:absolute; left:0; right:0; bottom:0; margin:0 auto; max-width:28rem; max-height:88dvh; overflow-y:auto; overscroll-behavior:contain; background:var(--surface); border-radius:1.25rem 1.25rem 0 0; box-shadow:0 0 0 1px rgb(243 243 243 / 0.1); padding:0.5rem 1rem max(1.5rem, env(safe-area-inset-bottom)); animation:htUp .22s cubic-bezier(.2,.8,.2,1); }
    .ht-grab { width:2.5rem; height:0.25rem; border-radius:999px; background:var(--border); margin:0.25rem auto 0.5rem; }
    .ht-head { display:flex; align-items:center; justify-content:space-between; gap:0.75rem; }
    .ht-head h2 { font-size:1.25rem; }
    .ht-anim { position:relative; margin-top:0.75rem; background:var(--inset); border-radius:1rem; box-shadow:0 0 0 1px rgb(243 243 243 / 0.06); overflow:hidden; }
    .ht-anim > svg { display:block; width:100%; height:auto; max-height:15rem; }
    .ht-static { display:flex; }
    .ht-static > div { flex:1; text-align:center; }
    .ht-static svg { display:block; width:100%; height:auto; }
    .ht-static span, .ht-tag { font-size:0.7rem; color:var(--muted); letter-spacing:0.08em; text-transform:uppercase; }
    .ht-static span { display:block; padding-bottom:0.5rem; }
    .ht-tag { position:absolute; top:0.5rem; left:0.75rem; }
    .ht-h { color:var(--primary); font-size:0.75rem; font-weight:700; letter-spacing:0.16em; text-transform:uppercase; margin:1.1rem 0 0.4rem; }
    .ht-list { margin:0; padding:0; list-style:none; }
    .ht-list li { position:relative; padding:0.3rem 0 0.3rem 1.4rem; font-size:0.9rem; line-height:1.4; }
    .ht-list li::before { position:absolute; left:0; top:0.3rem; font-weight:800; }
    .ht-list.cues li::before { content:"✓"; color:var(--done); }
    .ht-list.miss li::before { content:"✕"; color:var(--fail); }
    .ht-list.vari li { font-size:0.85rem; color:var(--muted); padding-left:0.9rem; }
    .ht-list.vari li::before { content:"•"; color:var(--muted); }
    .ht-two { display:grid; grid-template-columns:1fr 1fr; gap:0.75rem; }
    .ht-ladder { list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:0.375rem; }
    .ht-ladder li { display:flex; gap:0.625rem; align-items:flex-start; background:var(--inset); border-radius:0.75rem; padding:0.55rem 0.7rem; font-size:0.875rem; line-height:1.35; }

    .ht-ladder li em { font-style:normal; font-size:0.65rem; font-weight:800; letter-spacing:0.08em; text-transform:uppercase; color:var(--primary-fg); background:var(--primary); border-radius:999px; padding:0.05rem 0.4rem; margin-left:0.25rem; vertical-align:0.1em; }
    .ht-ladder li.on { box-shadow:0 0 0 1.5px var(--primary); }
    .ht-ladder li.done { opacity:0.6; }
    .ht-step { flex-shrink:0; width:1.4rem; height:1.4rem; border-radius:999px; background:var(--border); display:flex; align-items:center; justify-content:center; font-size:0.72rem; font-weight:800; }
    .ht-ladder li.on .ht-step { background:var(--primary); color:var(--primary-fg); }
    .ht-ladder li.done .ht-step { background:var(--done); color:var(--bg); }
    @keyframes htUp { from { transform:translateY(100%); } to { transform:none; } }
    @keyframes htFade { from { opacity:0; } to { opacity:1; } }
    @media (prefers-reduced-motion: reduce) { .ht-sheet, .ht-back { animation:none; } }
    .ht-fig .hl{fill:none;stroke:#f3f3f3;stroke-width:5;stroke-linecap:round;stroke-linejoin:round}
    .ht-fig .hl.ht{stroke-width:6.5}
    .ht-fig .hl.hb{stroke:#6a6a6a}
    .ht-fig .hh{fill:#f3f3f3}

const WAVE_REPS = [6, 8, 10, 12];
const PUSH_LEVELS = ["Kitchen bench","Kitchen table","Workout bench","Knees","Toes"];
const HEAVE_STAGES = [
  { name:"Dead hang", note:"Hang from the bar, shoulders packed. Timed holds — seconds, not reps.", seconds:true, startReps:20 },
  { name:"Heaves (feet assisted)", note:"Hang from the bar. Feet on floor or a box for assist. Chin over bar, lower with control.", seconds:false, startReps:6 },
  { name:"Negative heaves", note:"Jump or step to chin-over-bar, then lower in 3–5 seconds. No pull required.", seconds:false, startReps:6 },

const BENCH_STAGES = [
  { name:"Plate bench", note:"Lie on bench or floor. Press plates together or use a plate in each hand. Build to 10 kg × 12, then move to the bar.", startWeight:2.5, startReps:6, useBar:false },

function isHeaveLadder(ex){
  return !!ex?.heaveLadder;
}
function heaveStage(ex){
  const idx = Math.min(HEAVE_STAGES.length - 1, Math.max(0, ex?.levelIndex ?? 0));
  return HEAVE_STAGES[idx];
}
function syncHeaveExercise(ex){
  if (!isHeaveLadder(ex)) return ex;
  const stage = heaveStage(ex);
  let note = stage.note;
  if (stage.seconds && !/seconds/i.test(note)) note = `${note} Timed — seconds, not reps.`;
  return {...ex, name: stage.name, note};
}

  return !!ex?.benchLadder;
}

  const idx = Math.min(BENCH_STAGES.length - 1, Math.max(0, ex?.levelIndex ?? 0));
  return BENCH_STAGES[idx];
}

  if (!isBenchLadder(ex)) return ex;
  const stage = benchStage(ex);
  return {...ex, name: stage.name, note: stage.note};
}

const COSSACK_STAGES = [
  { name:"Supported lateral squat", note:"Hold a rack or bench. Shallow sit to the side — heel down. Both sides.", startReps:6, startWeight:0, loaded:false },

}
function cossackStage(ex){
  const idx = Math.min(COSSACK_STAGES.length - 1, Math.max(0, ex?.levelIndex ?? 0));
  return COSSACK_STAGES[idx];
}
function syncCossackExercise(ex){
  if (!isCossackLadder(ex)) return ex;
  const stage = cossackStage(ex);
  return {...ex, name: stage.name, note: stage.note};
}
function isPlankSeconds(ex){
  // Heave ladder: only Dead hang is timed — stage notes for negatives mention "seconds" of lowering, not hold time
  if (isHeaveLadder(ex)) return !!heaveStage(ex).seconds;
  return ex.id === "em-plank" || ex.id === "tp-plank" || /seconds/i.test(ex.note||"");
}
const AMRAP_BONUS = 2;
const KG_STEP = 2.5;
const KG_FLOOR = -50; // assisted (negative) loads; floor is practical plate steps
function clampKg(w){
  const n = +Number(w).toFixed(1);
  if (!Number.isFinite(n)) return 0;
  return Math.max(KG_FLOOR, n);
}
/** Display kg; unicode minus for negatives (assisted). */
function fmtKg(w){
  const n = +Number(w).toFixed(1);
  if (!Number.isFinite(n)) return "0";
  const body = n.toFixed(1).replace(/\.0$/, "");
  return n < 0 ? ("−" + body.slice(1)) : body;
}
function usesAmrap(ex){
  if (!ex || (ex.sets ?? 0) < 2) return false;
  if (isPlankSeconds(ex)) return false;
  if (ex.finisher) return false;
  if (isHeaveLadder(ex) && (ex.levelIndex ?? 0) < HEAVE_STAGES.length - 1) return false;
  if (isCossackLadder(ex) && (ex.levelIndex ?? 0) < COSSACK_STAGES.length - 1) return false;
  return true;
}
function isWaveProgram(programId, ex){
  const pid = programId || (typeof state !== "undefined" && state?.programId);
  return pid === "ember" || pid === "anvil" || pid === "titan" || String(ex?.id||"").startsWith("em-");
}

/** Upwards-only strength chain: a lift may not kg-progress past the next lift UP the chain. */
const BALANCE_CHAINS = {
  anvil: { row: "bench", bench: "squat", squat: "rdl" },
  ember: { "em-press": "em-row", "em-row": "em-bench", "em-bench": "em-squat", "em-squat": "em-rdl" },
  titan: { "tp-press": "tp-row", "tp-row": "tp-bench", "tp-bench": "tp-squat", "tp-squat": "tp-rdl" },
};
function ceilingFor(programId, exerciseId, sessionExs, progress){
  const explicit = BALANCE_CHAINS[programId];
  if (explicit) return explicit[exerciseId] || null;
  // Other programs with shared generic ids: press ≤ row ≤ bench ≤ squat ≤ rdl (or dl)
  if (exerciseId === "ohp") return "row";
  if (exerciseId === "row") return "bench";
  if (exerciseId === "bench") return "squat";
  if (exerciseId === "squat") {
    // Prefer rdl if both rdl and dl have a working weight
    if (workingWeightFor("rdl", sessionExs, progress) != null) return "rdl";
    if (workingWeightFor("dl", sessionExs, progress) != null) return "dl";
    return "rdl";
  }
  return null;
}
function liftLabelFor(id, sessionExs){
  const hit = (sessionExs || []).find(e => e.id === id);
  if (hit?.name) return hit.name;
  for (const p of PROGRAMS) {
    for (const d of p.days) {
      const ex = d.exercises.find(e => e.id === id);
      if (ex?.name) return ex.name;
    }
  }
  return id;
}
function workingWeightFor(id, sessionExs, progress){
  const hit = (sessionExs || []).find(e => e.id === id);
  if (hit && Number.isFinite(Number(hit.weight))) return Number(hit.weight);
  const p = progress?.[id];
  if (p && typeof p === "object" && Number.isFinite(Number(p.weight))) return Number(p.weight);
  return null;
}
/** Gate a would-be kg bump. Equality with ceiling is OK; exceeding is held. Skips heave ladders. */
function balanceKgHold(programId, ex, nextWeight, sessionExs, progress){
  if (!ex || isHeaveLadder(ex)) return null;
  // Cossack ladder: skip early stages; only gate final stage when loaded
  if (isCossackLadder(ex) && ((ex.levelIndex ?? 0) < COSSACK_STAGES.length - 1 || !(Number(ex.weight) > 0))) return null;
  const ceilId = ceilingFor(programId, ex.id, sessionExs, progress);
  if (!ceilId) return null;
  const ceilW = workingWeightFor(ceilId, sessionExs, progress);
  if (ceilW == null || !Number.isFinite(ceilW)) return null;
  const nw = +Number(nextWeight).toFixed(1);
  if (!(nw > ceilW)) return null;
  return {
    id: ex.id,
    name: ex.name,
    weight: Number(ex.weight) || 0,
    ceilingId: ceilId,
    ceilingName: liftLabelFor(ceilId, sessionExs),
    ceilingWeight: ceilW,
  };
}
function snapWaveRep(reps){
  const n = Number(reps);
  if (!Number.isFinite(n)) return WAVE_REPS[0];
  if (WAVE_REPS.includes(n)) return n;
  const up = WAVE_REPS.find(w => w >= n);
  return up != null ? up : WAVE_REPS[WAVE_REPS.length - 1];
}
function nextWaveStep(reps, weight){
  const idx = WAVE_REPS.indexOf(reps);
  if (idx >= 0 && idx < WAVE_REPS.length - 1) {
    const r = WAVE_REPS[idx + 1];
    return {reps:r, weight, note:`wave → 3×${r}`};
  }
  if (idx === WAVE_REPS.length - 1 || reps >= WAVE_REPS[WAVE_REPS.length - 1]) {
    const w = +(weight + 2.5).toFixed(1);
    return {reps:6, weight:w, note:`wave → 3×6 +2.5kg → ${w}kg`};
  }
  const next = WAVE_REPS.find(w => w > reps);
  if (next != null) return {reps:next, weight, note:`wave snap → 3×${next}`};
  const w = +(weight + 2.5).toFixed(1);
  return {reps:6, weight:w, note:`wave → 3×6 +2.5kg → ${w}kg`};
}
function normalizeWaveTargets(){
  const pid = state?.programId;
  if (pid !== "anvil" && pid !== "ember" && pid !== "titan") return false;
  let changed = false;
  const progress = {...(state.liftProgress || {})};
  state.exercises = (state.exercises || []).map(ex => {
    if (isPlankSeconds(ex) || ex.reps == null || WAVE_REPS.includes(ex.reps)) return ex;
    const reps = snapWaveRep(ex.reps);
    changed = true;
    const p = progress[ex.id];
    if (p && typeof p === "object" && p.reps !== reps) progress[ex.id] = {...p, reps};
    return {...ex, reps};
  });
  for (const [id, p] of Object.entries(progress)) {
    if (!p || typeof p !== "object" || p.reps == null) continue;
    if (id === "em-plank" || id === "em-heaves" || id === "tp-plank" || id === "tp-heaves" || /seconds/i.test(p.note||"")) continue;
    if (WAVE_REPS.includes(p.reps)) continue;
    progress[id] = {...p, reps: snapWaveRep(p.reps)};
    changed = true;
  }
  if (changed) state.liftProgress = progress;
  return changed;
}

function getProgram(id){ return PROGRAMS.find(p=>p.id===id) || PROGRAMS[0]; }
function blankSets(n){ return Array.from({length:n},()=>({ok:false,miss:false})); }
function toExercise(d){
  return {...d, streak:0, failStreak:0, levelIndex: d.levels?.length ? (d.levelIndex??0) : d.levelIndex, setsLog: blankSets(d.sets)};
}
function seedProgram(id, day=0){
  const p = getProgram(id);
  const d = p.days[Math.min(Math.max(0,day), p.days.length-1)];
  return d.exercises.map(toExercise);
}
function captureProgress(exs, prev={}){
  const next = {...prev};
  for (const ex of exs) next[ex.id] = {reps:ex.reps, weight:ex.weight, streak:ex.streak, failStreak:ex.failStreak, levelIndex:ex.levelIndex};
  return next;
}
function applyProgress(exs, progress, programId){
  const pid = programId || (typeof state !== "undefined" && state?.programId);
  const waveProg = pid === "ember" || pid === "anvil" || pid === "titan";
  return exs.map(ex => {
    const p = progress[ex.id];
    let next = p
      ? {...ex, reps:p.reps, weight:p.weight, streak:p.streak, failStreak:p.failStreak, levelIndex:p.levelIndex ?? ex.levelIndex}
      : ex;
    // Heave ladder: restore seed flags; em-heaves keeps migration for old progress
    if (ex.heaveLadder || next.heaveLadder || next.id === "em-heaves") {
      next = {
        ...next,
        heaveLadder: true,
        levels: (ex.levels?.length ? ex.levels : next.levels?.length ? next.levels : HEAVE_STAGES.map(s=>s.name)),
      };
      if (next.id === "em-heaves") {
        if (p && p.levelIndex != null && Number.isFinite(Number(p.levelIndex))) {
          next = {...next, levelIndex: Math.min(HEAVE_STAGES.length-1, Math.max(0, Number(p.levelIndex)))};
        } else if (p) {
          // Existing feet-assist progress without levelIndex → stage 1, keep reps/weight/streak
          next = {...next, levelIndex: 1};
        } else {
          next = {...next, levelIndex: 0, reps: HEAVE_STAGES[0].startReps};
        }
      } else if (p && p.levelIndex != null && Number.isFinite(Number(p.levelIndex))) {
        next = {...next, levelIndex: Math.min(HEAVE_STAGES.length-1, Math.max(0, Number(p.levelIndex)))};
      } else if (!p) {
        next = {...next, levelIndex: 0, reps: HEAVE_STAGES[0].startReps};
      }
      next = syncHeaveExercise(next);
    }
    // Bench ladder (TITAN plate → bar)
    if (ex.benchLadder || next.benchLadder) {
      next = {
        ...next,
        benchLadder: true,
        levels: (ex.levels?.length ? ex.levels : next.levels?.length ? next.levels : BENCH_STAGES.map(s=>s.name)),
      };
      if (p && p.levelIndex != null && Number.isFinite(Number(p.levelIndex))) {
        next = {...next, levelIndex: Math.min(BENCH_STAGES.length-1, Math.max(0, Number(p.levelIndex)))};
      } else if (!p) {
        next = {...next, levelIndex: 0, reps: BENCH_STAGES[0].startReps, weight: BENCH_STAGES[0].startWeight};
      }
      next = syncBenchExercise(next);
    }
    // Cossack ladder (ANVIL Day A)
    if (ex.cossackLadder || next.cossackLadder) {
      next = {
        ...next,
        cossackLadder: true,
        bilateral: true,
        levels: (ex.levels?.length ? ex.levels : next.levels?.length ? next.levels : COSSACK_STAGES.map(s=>s.name)),
      };
      if (p && p.levelIndex != null && Number.isFinite(Number(p.levelIndex))) {
        next = {...next, levelIndex: Math.min(COSSACK_STAGES.length-1, Math.max(0, Number(p.levelIndex)))};
      } else if (!p) {
        next = {...next, levelIndex: 0, reps: COSSACK_STAGES[0].startReps, weight: COSSACK_STAGES[0].startWeight};
      }
      next = syncCossackExercise(next);
    }
    if ((waveProg || String(next.id||"").startsWith("em-") || String(next.id||"").startsWith("tp-")) && !isPlankSeconds(next) && next.reps != null && !WAVE_REPS.includes(next.reps)) {
      next = {...next, reps: snapWaveRep(next.reps)};
    }
    return next;
  });
}
function hydrate(raw){
  if (!raw?.length) return null;
  const next = [];
  for (const e of raw) {
    if (!e.id || !e.name) continue;
    const sets = e.sets ?? 3;
    next.push({
      id:e.id, name:e.name, sets, rest:e.rest??90, weight:e.weight??0, reps:e.reps??8,
      bw:e.bw, nocap:e.nocap, cap:e.cap, block:e.block??"Session", bilateral:e.bilateral, note:e.note, finisher:e.finisher,
      heaveLadder:e.heaveLadder, benchLadder:e.benchLadder, cossackLadder:e.cossackLadder, levels:e.levels, levelIndex: e.levels?.length ? (e.levelIndex??0) : e.levelIndex,
      streak:e.streak??0, failStreak:e.failStreak??0, skipped:e.skipped??false,
      setsLog: e.setsLog && e.setsLog.length===sets ? e.setsLog : blankSets(sets),

  }

}
function currentIndex(exs){
  if (!exs.length) return 0;
  const i = exs.findIndex(e => !e.skipped && (e.setsLog||[]).some(s => !s.ok && !s.miss));
  return i < 0 ? exs.length-1 : i;
}

function exerciseResolved(ex){
  if (!ex) return true;
  if (ex.skipped) return true;
  const log = ex.setsLog || [];
  return log.length > 0 && log.every(s => s.ok || s.miss);
}
function exercisePassed(ex){
  if (!ex || ex.skipped) return false;
  const log = ex.setsLog || [];
  return log.length > 0 && log.every(s => s.ok && !s.miss);
}
function exerciseFailed(ex){
  if (!ex || ex.skipped) return false;
  return (ex.setsLog || []).some(s => s.miss);
}
function ensureExpandedEx(){
  if (!(ui.expandedEx instanceof Set)) ui.expandedEx = new Set();

}
function clearExpandedEx(){ ui.expandedEx = new Set(); }
function isExExpanded(ex){

  if (!exerciseResolved(ex)) return true;

}
function toggleExExpand(ei){
  const ex = state.exercises[ei];
  if (!ex || ex.skipped || !exerciseResolved(ex)) return;
  const set = ensureExpandedEx();
  if (set.has(ex.id)) set.delete(ex.id);
  else set.add(ex.id);
  render();
}
function nextIncompleteIndex(){
  return state.exercises.findIndex(e => !e.skipped && !exerciseResolved(e));
}
function scheduleJumpToNextIncomplete(){
  requestAnimationFrame(() => {
    requestAnimationFrame(() => {
      const ni = nextIncompleteIndex();
      const el = ni >= 0
        ? document.getElementById("ex-" + state.exercises[ni].id)
        : document.getElementById("log-session");

  });
}

const WALK_STORAGE = "anvil_walks_v1";
const WALK_MIN_SAVE_SEC = 30;
const WALK_MIN_MOVE_M = 6;
const WALK_MAX_ACC_M = 50;

let walk = {

function loadWalks(){

    walks = Array.isArray(raw) ? raw.filter(w => w && typeof w.date === "string" && typeof w.durationSec === "number") : [];
  } catch { walks = []; }
}
function saveWalks(){

function fmtWalkDuration(sec){
  const s = Math.max(0, Math.floor(sec));
  const h = Math.floor(s / 3600);
  const m = Math.floor((s % 3600) / 60);
  const r = s % 60;
  if (h > 0) return `${h}:${String(m).padStart(2,"0")}:${String(r).padStart(2,"0")}`;
  return `${m}:${String(r).padStart(2,"0")}`;
}

function brisbaneTodayISO(){
  try {
    return new Intl.DateTimeFormat("en-CA", { timeZone:"Australia/Brisbane", year:"numeric", month:"2-digit", day:"2-digit" }).format(new Date());
  } catch {
    const d = new Date();
    return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
  }
}
function brisbaneWeekdayShort(d = new Date()){
  try {
    return new Intl.DateTimeFormat("en-US", { timeZone:"Australia/Brisbane", weekday:"short" }).format(d);
  } catch {
    return ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"][d.getDay()];
  }
}
function mondayOfThisWeekISO(){
  const today = brisbaneTodayISO();
  const wd = brisbaneWeekdayShort();
  const idx = { Sun:0, Mon:1, Tue:2, Wed:3, Thu:4, Fri:5, Sat:6 }[wd] ?? 1;
  const fromMon = (idx + 6) % 7;
  const [y, m, d] = today.split("-").map(Number);
  const utc = Date.UTC(y, m - 1, d) - fromMon * 86400000;
  const t = new Date(utc);
  return `${t.getUTCFullYear()}-${String(t.getUTCMonth()+1).padStart(2,"0")}-${String(t.getUTCDate()).padStart(2,"0")}`;
}
function thisWeekISOs(){
  const mon = mondayOfThisWeekISO();
  const [y, m, d] = mon.split("-").map(Number);
  const base = Date.UTC(y, m - 1, d);
  return Array.from({ length:7 }, (_, i) => {
    const t = new Date(base + i * 86400000);
    return `${t.getUTCFullYear()}-${String(t.getUTCMonth()+1).padStart(2,"0")}-${String(t.getUTCDate()).padStart(2,"0")}`;
  });
}
function haversineKm(a, b){
  const R = 6371;
  const toRad = (x) => x * Math.PI / 180;
  const dLat = toRad(b.lat - a.lat);
  const dLon = toRad(b.lon - a.lon);
  const lat1 = toRad(a.lat), lat2 = toRad(b.lat);
  const h = Math.sin(dLat / 2) ** 2 + Math.cos(lat1) * Math.cos(lat2) * Math.sin(dLon / 2) ** 2;
  return 2 * R * Math.asin(Math.min(1, Math.sqrt(h)));
}

async function acquireWakeLock(){
  try {
    if (navigator.wakeLock && navigator.wakeLock.request) {
      walk.wakeLock = await navigator.wakeLock.request("screen");
      walk.wakeLock.addEventListener("release", () => {});
    }
  } catch {}
}
async function releaseWakeLock(){
  try { await walk.wakeLock?.release(); } catch {}
  walk.wakeLock = null;
}

function updateWalkLiveDom(){
  document.querySelectorAll("[data-walk-time]").forEach((el) => { el.textContent = fmtWalkDuration(walk.elapsedSec); });
  document.querySelectorAll("[data-walk-dist]").forEach((el) => { el.textContent = `${walk.distanceKm.toFixed(2)} km`; });
}

function onWalkTick(){
  if (!walk.active || !walk.startedAt) return;
  walk.elapsedSec = Math.max(0, Math.floor((Date.now() - walk.startedAt) / 1000));
  updateWalkLiveDom();
}

function onWalkPosition(pos){
  if (!walk.active) return;
  const coords = pos?.coords;
  if (!coords) return;
  const acc = Number(coords.accuracy);
  if (Number.isFinite(acc) && acc > WALK_MAX_ACC_M) return;
  const next = { lat: coords.latitude, lon: coords.longitude };
  if (!Number.isFinite(next.lat) || !Number.isFinite(next.lon)) return;
  if (walk.lastPos) {
    const km = haversineKm(walk.lastPos, next);
    const meters = km * 1000;
    if (meters >= WALK_MIN_MOVE_M) {
      walk.distanceKm += km;
      walk.lastPos = next;
      updateWalkLiveDom();
    }
  } else {
    walk.lastPos = next;
  }
  if (walk.geoMsg) {
    walk.geoMsg = "";
    if (ui.mainTab === "walk") render();
  }
}

function onWalkGeoError(err){
  if (!walk.active) return;
  if (err && (err.code === 1 || /denied/i.test(String(err.message || "")))) {
    walk.geoMsg = "Allow location for distance";
  } else {
    walk.geoMsg = "Location unavailable — time still tracks";
  }
  if (ui.mainTab === "walk") render();
}

function startWalkSession(){
  if (walk.active) return;
  walk.active = true;
  walk.startedAt = Date.now();
  walk.elapsedSec = 0;
  walk.distanceKm = 0;
  walk.lastPos = null;
  walk.geoMsg = "";
  if (walk.tick) clearInterval(walk.tick);
  walk.tick = setInterval(onWalkTick, 250);
  acquireWakeLock();
  if (navigator.geolocation) {
    try {
      walk.watchId = navigator.geolocation.watchPosition(onWalkPosition, onWalkGeoError, {
        enableHighAccuracy: true,
        maximumAge: 2000,
        timeout: 15000,
      });
    } catch {
      walk.geoMsg = "Location unavailable — time still tracks";
    }
  } else {
    walk.geoMsg = "Location unavailable — time still tracks";
  }
}

function stopWalkSession(){
  if (!walk.active) return;
  onWalkTick();
  const durationSec = walk.elapsedSec;
  const distanceKm = Math.round(walk.distanceKm * 100) / 100;
  const startedAt = walk.startedAt ? new Date(walk.startedAt).toISOString() : new Date().toISOString();
  const date = brisbaneTodayISO();

  if (walk.watchId != null && navigator.geolocation) {
    try { navigator.geolocation.clearWatch(walk.watchId); } catch {}
  }
  walk.watchId = null;
  if (walk.tick) clearInterval(walk.tick);
  walk.tick = null;
  releaseWakeLock();
  walk.active = false;
  walk.startedAt = null;
  walk.lastPos = null;

  if (durationSec >= WALK_MIN_SAVE_SEC) {
    walks.unshift({ date, durationSec, distanceKm, startedAt });
    if (walks.length > 500) walks.length = 500;
    saveWalks();
    syncSoon();
    toast("Walk saved", `${fmtWalkDuration(durationSec)} · ${distanceKm.toFixed(2)} km`);
  } else {
    toast("Walk discarded", "Under 30s — not saved");
  }
  walk.elapsedSec = 0;
  walk.distanceKm = 0;
  walk.geoMsg = "";
}

function toggleWalk(){
  if (walk.active) stopWalkSession();
  else startWalkSession();
  render();
}

function renderWalkBody(){

  const weekSet = new Set(days);
  const recent = walks.filter((w) => weekSet.has(w.date) || w.date === today).slice(0, 20);
  // Also include a few more recent if week empty / thin
  const histSource = recent.length ? recent : walks.slice(0, 12);
  const hist = histSource.length
    ? histSource.map((w) => {
        const when = (() => {
          try {
            return new Date(w.startedAt).toLocaleString("en-AU", {
              timeZone:"Australia/Brisbane", weekday:"short", day:"numeric", month:"short",

        return `<div class="walk-row"><div><strong>${esc(fmtWalkDuration(w.durationSec))}</strong>
          <p class="note" style="margin:0">${esc(when)}</p></div>

      }).join("")
    : `<p class="note" style="margin:.75rem 0 0">No walks yet — tap Start.</p>`;

  return `
    <section class="panel">

      <p class="tiny" style="margin:1rem 0 0">Distance</p>

    </section>
    <p class="foot">GPS needs permission and HTTPS. Distance may pause indoors or with poor signal. Tracking stops if the browser suspends the tab — keep ANVIL open while walking.</p>
  `;
}

      src.connect(ctx.destination);
      src.start(0);
    }
    if (ctx.state === "suspended") ctx.resume();

function prefetchClips(){
  if (!ctx || clipsPrefetching) return clipsPrefetching;
  clipsPrefetching = Promise.all(Object.entries(CLIP_URLS).map(async ([key, url]) => {
    if (clipBuffers[key]) return;
    try {
      const res = await fetch(url);
      if (!res.ok) return;

/** Soft ADSR tone — sine/triangle, no square-wave beeps. */
function playTone({ freq, dur = 0.14, type = "sine", attack = 0.01, release = 0.1, gain = 0.22, when = 0, slideTo = null }){
  if (!ctx) return;
  const vol = Math.max(0, Math.min(1, Number(state.soundVolume) || 0));
  if (vol <= 0) return;
  const t0 = when > 0 ? when : ctx.currentTime;
  const o = ctx.createOscillator();
  const g = ctx.createGain();
  o.type = type;
  o.frequency.setValueAtTime(freq, t0);
  if (slideTo != null) o.frequency.exponentialRampToValueAtTime(Math.max(20, slideTo), t0 + dur * 0.85);
  const peak = Math.max(0.0001, Math.min(CUE_MAX_GAIN, vol * gain * CUE_LOUDNESS));
  const atk = Math.max(0.004, attack);
  const rel = Math.max(atk + 0.02, dur);
  g.gain.setValueAtTime(0.0001, t0);
  g.gain.exponentialRampToValueAtTime(peak, t0 + atk);
  g.gain.exponentialRampToValueAtTime(0.0001, t0 + rel);
  o.connect(g); g.connect(ctx.destination);
  o.start(t0);
  o.stop(t0 + rel + 0.03);
}

function playTick(n, toneStyle){
  // Rising mid ticks for 3→2→1
  const base = { 3: 660, 2: 740, 1: 830 }[n] || 700;
  if (toneStyle === "pulse") {
    playTone({ freq: base * 0.45, dur: 0.11, type: "triangle", attack: 0.006, release: 0.1, gain: 0.32 });
    playTone({ freq: base * 0.9, dur: 0.08, type: "sine", attack: 0.004, release: 0.07, gain: 0.12 });
  } else if (toneStyle === "bell") {
    playTone({ freq: base * 1.15, dur: 0.1, type: "sine", attack: 0.005, release: 0.12, gain: 0.19 });
    playTone({ freq: base * 2.3, dur: 0.08, type: "sine", attack: 0.004, release: 0.09, gain: 0.08 });
  } else {
    // chime (default)
    playTone({ freq: base, dur: 0.1, type: "sine", attack: 0.008, release: 0.09, gain: 0.21 });
  }
}

function playEndChime(toneStyle, { soft = false } = {}){
  const t0 = ctx ? ctx.currentTime : 0;

  if (toneStyle === "pulse") {
    playTone({ freq: 140, dur: 0.22, type: "triangle", attack: 0.01, release: 0.2, gain: 0.36 * gScale, when: t0 });
    playTone({ freq: 220, dur: 0.28, type: "sine", attack: 0.012, release: 0.24, gain: 0.25 * gScale, when: t0 + 0.1 });
    playTone({ freq: 330, dur: 0.35, type: "sine", attack: 0.015, release: 0.3, gain: 0.21 * gScale, when: t0 + 0.22 });
  } else if (toneStyle === "bell") {
    playTone({ freq: 880, dur: 0.45, type: "sine", attack: 0.004, release: 0.42, gain: 0.23 * gScale, when: t0 });
    playTone({ freq: 1320, dur: 0.35, type: "sine", attack: 0.004, release: 0.32, gain: 0.12 * gScale, when: t0 });
    playTone({ freq: 1760, dur: 0.25, type: "sine", attack: 0.003, release: 0.22, gain: 0.06 * gScale, when: t0 + 0.02 });
    playTone({ freq: 1046, dur: 0.4, type: "sine", attack: 0.006, release: 0.36, gain: 0.16 * gScale, when: t0 + 0.16 });
  } else {
    // Warm ascending three-note chime (Strong/Hevy-ish)
    playTone({ freq: 523.25, dur: 0.18, type: "sine", attack: 0.01, release: 0.16, gain: 0.23 * gScale, when: t0 });
    playTone({ freq: 659.25, dur: 0.2, type: "sine", attack: 0.01, release: 0.18, gain: 0.23 * gScale, when: t0 + 0.12 });
    playTone({ freq: 783.99, dur: 0.32, type: "sine", attack: 0.012, release: 0.28, gain: 0.25 * gScale, when: t0 + 0.26 });
  }
}

function playClip(key){
  const vol = Math.max(0, Math.min(1, Number(state.soundVolume) || 0));
  if (!key || vol <= 0) return;
  const buf = clipBuffers[key];
  if (ctx && buf) {
    try {
      const src = ctx.createBufferSource();
      const g = ctx.createGain();
      g.gain.value = Math.min(CUE_MAX_GAIN, vol * CUE_LOUDNESS);
      src.buffer = buf;
      src.connect(g); g.connect(ctx.destination);
      src.start(0);
      return;
    } catch {}
  }
  // Element fallback if buffer not ready (still real file — not speechSynthesis)
  try {
    const url = CLIP_URLS[key];
    if (!url) return;
    const a = new Audio(url);
    a.volume = Math.min(CUE_MAX_GAIN, vol * CUE_LOUDNESS);
    a.play().catch(() => {});
  } catch {}
}

            const idx = orderIds.indexOf(sid);

    const body = { message: `${syncCfg.name.trim()} sync ${new Date().toISOString()}`, content: b64utf8(JSON.stringify(syncPayload(), null, 2)) };

    syncCfg.pending = true;

      if (!logged) {

        // Pass/fail only on rep-box tap: at/above target = ok, below = miss
        if (r >= ex.reps) return {ok:true, miss:false, reps:r};

  state.exercises = state.exercises.map(ex => ({...ex, skipped:false, setsLog: blankSets(ex.sets)}));
  clearExpandedEx();
  save(); render();
}
function setProgram(id, dayIndex=0){
  const program = getProgram(id);
  const day = Math.min(Math.max(0, dayIndex), program.days.length-1);
  const progress = captureProgress(state.exercises, state.liftProgress);
  state = {...state, programId: program.id, dayIndex: day, liftProgress: progress, exercises: applyProgress(seedProgram(program.id, day), progress, program.id)};
  clearExpandedEx();
  save(); render();
}
function setDay(dayIndex){
  const program = getProgram(state.programId);
  const day = Math.min(Math.max(0, dayIndex), program.days.length-1);
  const progress = captureProgress(state.exercises, state.liftProgress);
  state.dayIndex = day;
  state.liftProgress = progress;
  state.exercises = applyProgress(seedProgram(state.programId, day), progress, state.programId);

function addExercise(def){
  if (state.exercises.some(e => e.id === def.id)) return false;

  save(); return true;
}
function removeExercise(id){

  state.exercises = state.exercises.filter(e => e.id !== id);
  save(); return true;
}
function logSession(){
  const notes = [];
  const lifts = [];
  const balanceHolds = [];
  const sessionExs = state.exercises;
  const progressSnap = state.liftProgress || {};
  const programId = state.programId;
  /** Apply a +kg bump or hold for balance. On hold: keep weight + reps, streak stays at 3 so next clean retries. */
  function takeKgBump(ex, nextWeight, nextReps, streakAfterOk, successNote){
    const hold = balanceKgHold(programId, ex, nextWeight, sessionExs, progressSnap);
    if (hold) {
      notes.push(`${ex.name}: held for balance — stays ${hold.weight} kg until ${hold.ceilingName} moves up (now ${hold.ceilingWeight} kg)`);
      balanceHolds.push(hold);
      return { weight: ex.weight, reps: ex.reps, streak: 3, held: true };
    }
    notes.push(successNote);
    return { weight: nextWeight, reps: nextReps, streak: streakAfterOk, held: false };
  }
  const exercises = state.exercises.map(ex => {
    const touched = ex.setsLog.some(s => s.ok || s.miss);
    if (ex.skipped || !touched) {
      if (ex.skipped) notes.push(`${ex.name}: skipped`);
      return {...ex, skipped:false, setsLog: blankSets(ex.sets)};
    }
    // Snapshot working targets before wave / progression bumps
    const workedWeight = ex.weight;
    const workedReps = ex.reps;
    const all = ex.setsLog.every(s => s.ok || s.miss);
    // Enforce: ok only when reps >= target; otherwise treat as miss
    const setsLog = ex.setsLog.map(s => {
      if (!s.ok && !s.miss) return s;
      const r = s.reps ?? ex.reps;
      if (r >= ex.reps) return {ok:true, miss:false, reps:r};
      return {ok:false, miss:true, reps:r};
    });
    const clean = all && setsLog.every(s => s.ok && !s.miss);
    const lastSet = setsLog[setsLog.length - 1];
    const lastReps = lastSet?.reps ?? ex.reps;
    const amrapHit = usesAmrap(ex) && clean && lastReps >= ex.reps + AMRAP_BONUS;
    const liftEntry = { id: ex.id, name: ex.name, weight: workedWeight, reps: workedReps, clean };
    if (usesAmrap(ex)) liftEntry.amrapReps = lastReps;
    lifts.push(liftEntry);
    if (!all) { notes.push(`${ex.name}: incomplete`); return {...ex, setsLog: blankSets(ex.sets)}; }
    if (!clean) {
      let failStreak = (ex.failStreak||0)+1;
      let {reps, weight} = ex;
      if (failStreak >= 3) {
        failStreak = 0;
        if (ex.bw) {
          if (weight !== 0) {
            weight = clampKg(+(weight-2.5).toFixed(1));
            notes.push(`${ex.name}: RESET WEEK — ${fmtKg(weight)} kg × ${reps}`);
          } else {
            if (reps>6) reps-=2;
            notes.push(`${ex.name}: RESET WEEK — reps back to ${reps}`);
          }
        } else {
          weight = clampKg(+(weight-2.5).toFixed(1));
          if (ex.cap) notes.push(`${ex.name}: RESET WEEK — ${fmtKg(weight)} kg × ${reps}`);
          else { if (reps>8) reps-=2; notes.push(`${ex.name}: RESET WEEK — ${fmtKg(weight)} kg × ${reps}`); }
        }
      } else notes.push(`${ex.name}: no-rep ${failStreak}/3 — stay at ${reps}`);
      return {...ex, streak:0, failStreak, reps, weight, setsLog: blankSets(ex.sets)};
    }
    if (isWaveProgram(state.programId, ex)) {
      // Ember / Anvil / Titan shared ladder: 6 → 8 → 10 → 12, then 6 +2.5kg
      // Heave ladder + TITAN plate-bench → barbell graduate
      // AMRAP last-set (+2 over target) bumps load immediately — skips wave climb this session
      // Balance chain only gates kg bumps (not wave climbs or stage graduates)
      let streak = (ex.streak||0) + 1;
      let {reps, weight} = ex;
      let levelIndex = ex.levelIndex ?? 0;
      if (amrapHit) {
        streak = 0;
        if (isBenchLadder(ex)) {
          const idx = levelIndex;
          const stage = BENCH_STAGES[Math.min(idx, BENCH_STAGES.length-1)];
          const last = idx >= BENCH_STAGES.length - 1;
          if (!last && !stage.useBar && reps === 12 && weight >= 10) {
            levelIndex = idx + 1;
            const nextStage = BENCH_STAGES[levelIndex];
            reps = nextStage.startReps; weight = nextStage.startWeight;
            notes.push(`${ex.name}: AMRAP ${lastReps} → graduated → ${nextStage.name}`);
          } else {
            const bumped = +(weight + 2.5).toFixed(1);
            const r = takeKgBump(ex, bumped, reps, 0, `${ex.name}: AMRAP ${lastReps} → +2.5kg · ${bumped}kg × ${reps}`);
            weight = r.weight; reps = r.reps; streak = r.streak;
          }
        } else {
          // Full heaves (final stage) and normal wave lifts: +2.5kg, keep reps
          const bumped = +(weight + 2.5).toFixed(1);
          const r = takeKgBump(ex, bumped, reps, 0, `${ex.name}: AMRAP ${lastReps} → +2.5kg · ${bumped}kg × ${reps}`);
          weight = r.weight; reps = r.reps; streak = r.streak;
        }
      } else if (streak < 3) {
        const sec = isPlankSeconds(ex);
        notes.push(`${ex.name}: clean streak ${streak}/3 at 3×${reps}${sec?"s":""}`);
      } else if (isHeaveLadder(ex)) {
        const idx = levelIndex;
        const stage = HEAVE_STAGES[Math.min(idx, HEAVE_STAGES.length-1)];
        const last = idx >= HEAVE_STAGES.length - 1;
        if (stage.seconds) {
          if (reps < 30) {
            reps = 30; streak = 0;
            notes.push(`${ex.name}: wave → 3×30s`);
          } else if (!last) {
            levelIndex = idx + 1; reps = 6; weight = 0; streak = 0;
            notes.push(`${ex.name}: graduated → ${HEAVE_STAGES[levelIndex].name}`);
          } else {
            reps = 20; streak = 0;
            notes.push(`${ex.name}: wave → 3×20s`);
          }
        } else {
          const atGraduatePoint = WAVE_REPS.indexOf(reps) === WAVE_REPS.length - 1;
          if (atGraduatePoint && !last) {
            levelIndex = idx + 1; reps = 6; weight = 0; streak = 0;
            notes.push(`${ex.name}: graduated → ${HEAVE_STAGES[levelIndex].name}`);
          } else {
            // Heave ladder kg bumps are skipped from the balance chain (BW / no clear ceiling)
            const step = nextWaveStep(reps, weight);
            reps = step.reps; weight = step.weight; streak = 0;
            notes.push(`${ex.name}: ${step.note}`);
          }
        }
      } else if (isCossackLadder(ex)) {
        const idx = levelIndex;
        const last = idx >= COSSACK_STAGES.length - 1;
        const atGraduatePoint = WAVE_REPS.indexOf(reps) === WAVE_REPS.length - 1;
        if (atGraduatePoint && !last) {
          levelIndex = idx + 1;
          const nextStage = COSSACK_STAGES[levelIndex];
          reps = nextStage.startReps; weight = nextStage.startWeight ?? 0; streak = 0;
          notes.push(`${ex.name}: graduated → ${nextStage.name}`);
        } else {
          const step = nextWaveStep(reps, weight);
          if (step.weight > weight) {
            const r = takeKgBump(ex, step.weight, step.reps, 0, `${ex.name}: ${step.note}`);
            weight = r.weight; reps = r.reps; streak = r.streak;
          } else {
            reps = step.reps; weight = step.weight; streak = 0;
            notes.push(`${ex.name}: ${step.note}`);
          }
        }
      } else if (isBenchLadder(ex)) {
        const idx = levelIndex;
        const stage = BENCH_STAGES[Math.min(idx, BENCH_STAGES.length-1)];
        const last = idx >= BENCH_STAGES.length - 1;
        const atTopWave = WAVE_REPS.indexOf(reps) === WAVE_REPS.length - 1;
        // 3 clean at 3×12 with plate weight ≥ 10 kg → Bench Press 3×6 @ 20 kg
        if (!last && !stage.useBar && atTopWave && weight >= 10) {
          levelIndex = idx + 1;
          const nextStage = BENCH_STAGES[levelIndex];
          reps = nextStage.startReps; weight = nextStage.startWeight; streak = 0;
          notes.push(`${ex.name}: graduated → ${nextStage.name}`);
        } else {
          const step = nextWaveStep(reps, weight);
          if (step.weight > weight) {
            const r = takeKgBump(ex, step.weight, step.reps, 0, `${ex.name}: ${step.note}`);
            weight = r.weight; reps = r.reps; streak = r.streak;
          } else {
            reps = step.reps; weight = step.weight; streak = 0;
            notes.push(`${ex.name}: ${step.note}`);
          }
        }
      } else if (isPlankSeconds(ex)) {
        if (reps < 30) {
          reps = 30; streak = 0;
          notes.push(`${ex.name}: wave → 3×30s`);
        } else {
          reps = 20; streak = 0;
          notes.push(`${ex.name}: wave → 3×20s (no kg)`);
        }
      } else if (ex.finisher) {
        const step = nextWaveStep(reps, weight);
        streak = 0;
        if (step.weight > weight) notes.push(`${ex.name}: finisher — hold 3×${reps}, no kg`);
        else { reps = step.reps; notes.push(`${ex.name}: ${step.note}`); }
      } else {
        const step = nextWaveStep(reps, weight);
        if (step.weight > weight) {
          const r = takeKgBump(ex, step.weight, step.reps, 0, `${ex.name}: ${step.note}`);
          weight = r.weight; reps = r.reps; streak = r.streak;
        } else {
          reps = step.reps; weight = step.weight; streak = 0;
          notes.push(`${ex.name}: ${step.note}`);
        }
      }
      let out = {...ex, streak, failStreak:0, reps, weight, levelIndex, setsLog: blankSets(ex.sets)};
      if (isHeaveLadder(out)) out = syncHeaveExercise(out);
      if (isBenchLadder(out)) out = syncBenchExercise(out);
      if (isCossackLadder(out)) out = syncCossackExercise(out);
      return out;
    }
    let {reps, weight} = ex;
    let levelIndex = ex.levelIndex ?? 0;
    if (amrapHit) {
      if (weight > 0 || !ex.bw) {
        const bumped = +(weight + 2.5).toFixed(1);
        const r = takeKgBump(ex, bumped, reps, 0, `${ex.name}: AMRAP ${lastReps} → +2.5kg · ${bumped}kg × ${reps}`);
        weight = r.weight; reps = r.reps;
        return {...ex, streak:r.streak, failStreak:0, reps, weight, levelIndex, setsLog: blankSets(ex.sets)};
      } else {
        reps = Math.max(ex.reps + 2, lastReps);
        notes.push(`${ex.name}: AMRAP ${lastReps} → reps ${reps}`);
      }
      return {...ex, streak:0, failStreak:0, reps, weight, levelIndex, setsLog: blankSets(ex.sets)};
    }
    const minLogged = Math.min(...setsLog.map(s => s.reps ?? ex.reps));
    // Carry-forward: all sets clean above target → raise range immediately
    if (minLogged > ex.reps) {
      reps = minLogged;
      notes.push(`${ex.name}: target → ${reps} (from logged sets)`);
      return {...ex, streak:1, failStreak:0, reps, weight, levelIndex, setsLog: blankSets(ex.sets)};
    }
    let streak = ex.streak+1;
    if (streak >= 3) {
      streak = 0;
      if (ex.levels?.length) {
        const last = levelIndex >= ex.levels.length-1;
        if (!last && reps >= (ex.cap||10)) { levelIndex += 1; reps = 5; notes.push(`${ex.name}: ${ex.levels[levelIndex]} · start at ${reps}`); }
        else { reps += 2; notes.push(`${ex.name}: reps → ${reps} · ${ex.levels[levelIndex]}`); }
      } else if (ex.bw) {
        if (ex.nocap || reps < (ex.cap||16)) { reps += 2; notes.push(`${ex.name}: reps → ${reps}`); }
        else {
          const bumped = +(weight+2.5).toFixed(1);
          const r = takeKgBump(ex, bumped, reps, 3, `${ex.name}: +2.5kg → ${bumped}`);
          weight = r.weight; reps = r.reps; streak = r.held ? 3 : 0;
        }
      } else if (ex.cap && reps >= ex.cap) {
        const bumped = +(weight+2.5).toFixed(1);
        const r = takeKgBump(ex, bumped, reps, 3, `${ex.name}: +2.5kg → ${bumped}`);
        weight = r.weight; reps = r.reps; streak = r.held ? 3 : 0;
      } else if (reps >= 12) {
        const bumped = +(weight+2.5).toFixed(1);
        const r = takeKgBump(ex, bumped, 8, 3, `${ex.name}: +2.5kg → ${bumped}, reps 8`);
        weight = r.weight; reps = r.reps; streak = r.held ? 3 : 0;
      }
      else { reps += 2; notes.push(`${ex.name}: reps → ${reps}`); }
    } else notes.push(`${ex.name}: clean ${streak}/3 at ${reps}`);
    return {...ex, streak, failStreak:0, reps, weight, levelIndex, setsLog: blankSets(ex.sets)};
  });
  state.exercises = exercises;
  state.liftProgress = captureProgress(exercises, state.liftProgress);
  state.history = [{date:new Date().toISOString(), notes, lifts}, ...state.history].slice(0,60);
  ui.pendingHolds = balanceHolds.length ? balanceHolds : null;
  save();
  syncSoon();
  return notes;
}


async function applyUpdate(){
  const reg = ui.swReg || (await navigator.serviceWorker.getRegistration());
  const waiting = reg && reg.waiting;
  if (waiting) {
    ui.refreshing = true;
    waiting.postMessage({ type: "SKIP_WAITING" });
    setTimeout(() => location.reload(), 1500);
    return;
  }
  try { await reg?.update(); } catch {}
  location.reload();
}

async function checkForUpdate(){
  if (!("serviceWorker" in navigator) || !location.protocol.startsWith("http")) {
    toast("Updates need the web app", "Open the GitHub Pages link, not a downloaded file.");
    return;
  }
  ui.updateChecking = true;
  toast("Checking…");
  render();
  try {
    const reg = ui.swReg || (await navigator.serviceWorker.getRegistration());
    if (!reg) {
      toast("No service worker yet");
      ui.updateChecking = false;
      render();
      return;
    }
    await reg.update();
    await new Promise((r) => setTimeout(r, 600));
    const pending = Boolean(reg.waiting || (reg.installing && navigator.serviceWorker.controller));
    if (pending || ui.updateReady) {
      ui.updateReady = true;
      toast("Update available");
    } else {
      toast("You're on the latest");
    }
  } catch {
    toast("Check failed");
  }
  ui.updateChecking = false;
  render();
}

function toast(msg, desc){
  const el = document.getElementById("toast");
  el.textContent = desc ? `${msg} — ${desc}` : msg;
  el.classList.remove("hide");
  clearTimeout(ui.toastTimer);
  ui.toastTimer = setTimeout(() => el.classList.add("hide"), 2800);
}

function clearTick(){ if (tick) { clearInterval(tick); tick = null; } }
function cueGo(){
  ui.running = false; ui.isGo = true; ui.remain = 0; remainVal = 0;
  cueComplete();
  if (navigator.vibrate) navigator.vibrate([180,70,180,70,280]);
  render();
}
function startRest(sec){
  clearTick(); lastCue = -1; ui.isGo = false; remainVal = sec; ui.remain = sec; ui.running = true; render();
  tick = setInterval(() => {
    remainVal -= 1;
    const r = remainVal;
    if ((r===3||r===2||r===1) && lastCue !== r) { lastCue = r; cueCountdown(r); if (navigator.vibrate) navigator.vibrate(80); }
    if (r <= 0) { clearTick(); cueGo(); return; }
    ui.remain = r; renderTimerOnly();
  }, 1000);
}
function stopRest(){ clearTick(); ui.running=false; ui.remain=0; remainVal=0; ui.isGo=false; }
function adjustRest(d){
  const base = remainVal > 0 ? remainVal : (ui.remain || 90);
  const next = Math.max(5, base + d);
  if (ui.running && tick) { remainVal = next; ui.remain = next; render(); return; }
  startRest(next);
}

function bumpSetReps(ei, si, delta){
  const ex0 = state.exercises[ei];
  if (!ex0 || ex0.skipped) return;
  state.exercises = state.exercises.map((ex,i) => {
    if (i!==ei) return ex;
    const target = ex.reps;
    const max = maxRep(ex) || 50;
    const log = ex.setsLog.map((s,j) => {
      if (j!==si) return s;
      const cur = s.reps ?? target;
      const next = Math.max(0, Math.min(max, cur + delta));
      // −/+ only adjust displayed reps; never mark complete/miss
      return {...s, reps:next};
    });
    return {...ex, setsLog:log};
  });
  save(); render();
}
function onMark(ei, si){
  unlockAudio();
  const before = state.exercises[ei].setsLog[si];
  const starting = !before.ok && !before.miss;
  const justFinished = markSet(ei, si);
  if (starting) startRest(state.exercises[ei].rest);
  if (justFinished) scheduleJumpToNextIncomplete();
}
function onLog(){
  const startedOpen = state.exercises.some(ex => {
    if (ex.skipped) return false;
    const touched = ex.setsLog.some(s => s.ok || s.miss);
    if (!touched) return false;
    return !ex.setsLog.every(s => s.ok || s.miss);
  });
  if (startedOpen) { toast("Finish or skip the lifts you started"); return; }
  const anyWork = state.exercises.some(ex => !ex.skipped && ex.setsLog.some(s => s.ok || s.miss));
  if (!anyWork) { toast("Tick a set first — blank lifts are skipped"); return; }
  const notes = logSession();
  const program = getProgram(state.programId);
  if (program.days.length > 1) {
    setDay((state.dayIndex + 1) % program.days.length);
  }
  toast("Session logged", notes.slice(0,3).join(" · "));
  clearExpandedEx();
  stopRest();
  if (ui.pendingHolds?.length) {
    ui.panel = "balance-hold";
  } else {
    const lastKg = state.bodyWeightLog[0]?.kg;
    ui.bwDraftKg = (typeof lastKg === "number" && lastKg > 0) ? lastKg : null;
    ui.bwLinkSession = true;
    ui.panel = "bodyweight";
  }
  render();
}
function dismissBalanceHold(){
  ui.pendingHolds = null;
  const lastKg = state.bodyWeightLog[0]?.kg;
  ui.bwDraftKg = (typeof lastKg === "number" && lastKg > 0) ? lastKg : null;
  ui.bwLinkSession = true;
  ui.panel = "bodyweight";
  render();
}

function openBodyWeightPrompt(linkSession){
  const lastKg = state.bodyWeightLog[0]?.kg;
  ui.bwDraftKg = (typeof lastKg === "number" && lastKg > 0) ? lastKg : null;
  ui.bwLinkSession = !!linkSession;
  ui.panel = "bodyweight";
  render();
}

function bumpBodyWeight(delta){
  const base = (typeof ui.bwDraftKg === "number" && ui.bwDraftKg > 0) ? ui.bwDraftKg : (state.bodyWeightLog[0]?.kg || 70);
  ui.bwDraftKg = Math.max(20, Math.min(300, +(base + delta).toFixed(1)));
  render();
}

function saveBodyWeight(){
  const kg = typeof ui.bwDraftKg === "number" ? +ui.bwDraftKg.toFixed(1) : 0;
  if (!(kg > 0)) { toast("Set your body weight"); return; }
  const date = (ui.bwLinkSession && state.history[0]?.date) ? state.history[0].date : new Date().toISOString();
  if (ui.bwLinkSession && state.history[0]) {
    state.history[0] = {...state.history[0], bodyWeightKg: kg};
  }
  state.bodyWeightLog = [{ date, kg }, ...(state.bodyWeightLog || [])].slice(0, 90);
  save();
  toast("Body weight saved", `${kg} kg`);
  ui.bwLinkSession = false;
  ui.panel = "settings";
  ui.settingsTab = "progress";
  render();

function skipBodyWeight(){
  ui.bwLinkSession = false;
  ui.panel = "settings";
  ui.settingsTab = "progress";
  render();
}

function liftSeries(liftId){
  const pts = [];
  for (let i = (state.history||[]).length - 1; i >= 0; i--) {
    const h = state.history[i];
    if (!Array.isArray(h.lifts)) continue;
    const hit = h.lifts.find(l => l.id === liftId);
    if (!hit) continue;
    { const w = Number(hit.weight); const r = Number(hit.reps); pts.push({ t: h.date, weight: Number.isFinite(w) ? w : 0, reps: Number.isFinite(r) ? r : 0, clean: !!hit.clean, name: hit.name }); }
  }
  return pts;
}

function bodySeries(){
  const log = state.bodyWeightLog || [];
  const pts = [];
  for (let i = log.length - 1; i >= 0; i--) {
    const e = log[i];
    if (!e || !(Number(e.kg) > 0)) continue;
    pts.push({ t: e.date, y: Number(e.kg) });
  }
  return pts;
}

function progressLiftOptions(){
  const map = new Map();
  for (const h of (state.history || [])) {
    if (!Array.isArray(h.lifts)) continue;
    for (const l of h.lifts) {
      if (!l?.id) continue;
      map.set(l.id, l.name || l.id);
    }
  }
  return [...map.entries()].map(([id, name]) => ({ id, name }));
}

function isRepsChartLift(pts){
  if (!pts.length) return false;
  const last = pts[pts.length - 1];
  // Non-zero includes negative assist kg — chart those as load, not reps
  const hasLoad = (w) => Number.isFinite(w) && w !== 0;
  const allZeroW = pts.every(p => !hasLoad(p.weight));
  return allZeroW || !hasLoad(last.weight);
}

const CHART_DATA = {};
const PROGRESS_RANGES = { "last3": { label:"Last 3", days:0, last:3, walkWeeks:3, desc:"last 3" }, "1m": { label:"1 month", days:30, walkWeeks:5, desc:"1 month" }, "6m": { label:"6 months", days:182, walkWeeks:26, desc:"6 months" }, "1y": { label:"1 year", days:365, walkWeeks:52, desc:"1 year" } };
function fmtNum(v){
  if (!Number.isFinite(v)) return "—";
  const r = Math.abs(v - Math.round(v)) < 0.05 ? String(Math.round(Math.abs(v))) : Math.abs(v).toFixed(1);
  return (v < 0 ? "−" : "") + r;
}
function fmtSigned(v){
  if (!Number.isFinite(v)) return "—";
  if (Math.abs(v) < 0.05) return "0";
  return (v > 0 ? "+" : "") + fmtNum(v);
}
function fmtShortDate(t){
  try { return new Date(t).toLocaleDateString("en-AU",{timeZone:"Australia/Brisbane",day:"numeric",month:"short"}); }
  catch { return ""; }
}
function fmtDayDate(t){
  try { return new Date(t).toLocaleDateString("en-AU",{timeZone:"Australia/Brisbane",weekday:"short",day:"numeric",month:"short"}); }
  catch { return ""; }
}
function curRange(){ return PROGRESS_RANGES[ui.progressRange] || PROGRESS_RANGES["1m"]; }
// pts oldest → newest; "Last 3" = last 3 entries of that series
function inRange(pts){
  const r = curRange();
  const ok = pts.filter(p => Number.isFinite(new Date(p.t).getTime()));
  if (r.last) return ok.slice(-r.last);
  const cut = Date.now() - r.days * 86400000;
  return ok.filter(p => new Date(p.t).getTime() >= cut);

// Monotone cubic (Fritsch–Carlson): smooth, never overshoots the real values
function smoothPath(c){
  const n = c.length, f1 = (v) => v.toFixed(1);
  if (n < 3) return c.map((p, i) => `${i ? "L" : "M"}${f1(p.x)} ${f1(p.y)}`).join("");
  const dx = [], m = [], t = new Array(n);
  for (let i = 0; i < n - 1; i++) { dx[i] = c[i+1].x - c[i].x || 1e-6; m[i] = (c[i+1].y - c[i].y) / dx[i]; }
  t[0] = m[0]; t[n-1] = m[n-2];
  for (let i = 1; i < n - 1; i++) t[i] = m[i-1] * m[i] <= 0 ? 0 : (3 * (dx[i-1] + dx[i])) / ((2 * dx[i] + dx[i-1]) / m[i-1] + (dx[i] + 2 * dx[i-1]) / m[i]);
  let d = `M${f1(c[0].x)} ${f1(c[0].y)}`;
  for (let i = 0; i < n - 1; i++) {
    const h = dx[i] / 3;
    d += `C${f1(c[i].x + h)} ${f1(c[i].y + t[i] * h)} ${f1(c[i+1].x - h)} ${f1(c[i+1].y - t[i+1] * h)} ${f1(c[i+1].x)} ${f1(c[i+1].y)}`;

}
function niceStep(span, target){
  const raw = span / Math.max(1, target);
  const mag = Math.pow(10, Math.floor(Math.log10(raw)));
  const n = raw / mag;
  const step = n <= 1 ? 1 : n <= 2 ? 2 : n <= 2.5 ? 2.5 : n <= 5 ? 5 : 10;
  return step * mag;
}
function movingAvg(ys, win){
  return ys.map((_, i) => {
    const s = ys.slice(Math.max(0, i - win + 1), i + 1);
    return s.reduce((a, b) => a + b, 0) / s.length;

}
// points: [{t, y, read, pr?, hollow?}] oldest → newest
function svgLineChart(id, points, { unit = "", trend = 0, zeroLine = false } = {}){
  if (!points.length) return `<p class="chart-empty">No data in this range.</p>`;
  const W = 240, H = 150, padL = 30, padR = 10, padT = 12, padB = 22;
  const x0 = padL, x1 = W - padR, y0 = padT, y1 = H - padB;
  const ms = points.map(p => new Date(p.t).getTime());
  const ys = points.map(p => p.y);
  const trendYs = trend && points.length >= 3 ? movingAvg(ys, trend) : null;
  let lo = Math.min(...ys), hi = Math.max(...ys);
  if (zeroLine && lo < 0) hi = Math.max(hi, 0);
  if (zeroLine && hi > 0 && lo < 0) { /* zero inside */ }
  if (hi - lo < 1) { const mid = (hi + lo) / 2; lo = mid - 1; hi = mid + 1; }
  const step = niceStep(hi - lo, 3);
  let yMin = Math.floor(lo / step) * step, yMax = Math.ceil(hi / step) * step;
  if (yMax - yMin < step) yMax = yMin + step;
  let tMin = Math.min(...ms), tMax = Math.max(...ms);
  const single = tMax - tMin < 3600000;
  const X = (t) => single ? (x0 + x1) / 2 : x0 + ((t - tMin) / (tMax - tMin)) * (x1 - x0);
  const Y = (v) => y1 - ((v - yMin) / (yMax - yMin)) * (y1 - y0);
  const f1 = (n) => n.toFixed(1);
  let grid = "";
  for (let v = yMin; v <= yMax + step / 2; v += step) {
    const yy = Y(v);
    const isZero = Math.abs(v) < step / 100;
    grid += `<line x1="${x0}" y1="${f1(yy)}" x2="${x1}" y2="${f1(yy)}" stroke="${isZero && zeroLine ? "var(--muted)" : "var(--border)"}" stroke-width="${isZero && zeroLine ? 1 : 0.75}"${isZero && zeroLine ? ' stroke-dasharray="3 3"' : ""}/>`;
    grid += `<text x="${x0 - 4}" y="${f1(yy + 3.5)}" fill="var(--muted)" font-size="9.5" text-anchor="end">${esc(fmtNum(v))}</text>`;
  }
  let xt = "";
  const tickTs = single ? [ms[0]] : [tMin, (tMin + tMax) / 2, tMax];
  tickTs.forEach((t, i) => {
    const anchor = single ? "middle" : i === 0 ? "start" : i === 2 ? "end" : "middle";
    xt += `<text x="${f1(X(t))}" y="${H - 6}" fill="var(--muted)" font-size="9.5" text-anchor="${anchor}">${esc(fmtShortDate(t))}</text>`;
  });
  const coords = points.map((p, i) => ({ x: X(ms[i]), y: Y(p.y) }));
  const path = smoothPath(coords);
  const area = coords.length > 1 ? `${path}L${f1(coords[coords.length-1].x)} ${y1}L${f1(coords[0].x)} ${y1}Z` : "";
  const trendPath = trendYs ? smoothPath(trendYs.map((v, i) => ({ x: coords[i].x, y: Y(v) }))) : "";
  const showDots = points.length <= 40;
  const dots = points.map((p, i) => {
    const c = coords[i];
    if (p.pr) return `<circle cx="${f1(c.x)}" cy="${f1(c.y)}" r="4.5" fill="var(--surface)" stroke="var(--done)" stroke-width="2"/>`;
    if (!showDots && i !== points.length - 1) return "";
    return p.hollow
      ? `<circle cx="${f1(c.x)}" cy="${f1(c.y)}" r="3" fill="var(--surface)" stroke="var(--primary)" stroke-width="1.5"/>`
      : `<circle cx="${f1(c.x)}" cy="${f1(c.y)}" r="3" fill="var(--primary)"/>`;
  }).join("");
  const hits = points.map((p, i) => `<circle class="chart-hit" data-act="chart-pt" data-c="${esc(id)}" data-i="${i}" cx="${f1(coords[i].x)}" cy="${f1(coords[i].y)}" r="11" fill="transparent"/>`).join("");
  CHART_DATA[id] = points.map((p, i) => ({ x: coords[i].x, y: coords[i].y, read: p.read }));
  const last = points[points.length - 1];
  const gid = `g-${id}`;
  const lc = coords[coords.length - 1];
  const tagTxt = `${fmtNum(last.y)}${unit === "kg" ? " kg" : ""}`;
  const tagW = tagTxt.length * 6 + 10;
  const tagX = Math.min(x1 - tagW / 2, Math.max(x0 + tagW / 2, lc.x));
  const tagY = lc.y - 12 < y0 + 2 ? lc.y + 18 : lc.y - 12;
  const latestTag = `<circle cx="${f1(lc.x)}" cy="${f1(lc.y)}" r="7" fill="var(--primary)" fill-opacity=".25"/><circle cx="${f1(lc.x)}" cy="${f1(lc.y)}" r="4" fill="var(--primary)" stroke="var(--fg)" stroke-width="1.5"/>
    <rect x="${f1(tagX - tagW / 2)}" y="${f1(tagY - 10)}" width="${tagW}" height="14" rx="7" fill="var(--primary)"/><text x="${f1(tagX)}" y="${f1(tagY + 0.5)}" fill="var(--primary-fg)" font-size="9.5" font-weight="700" text-anchor="middle">${esc(tagTxt)}</text>`;
  return `<svg class="chart-svg" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(unit)} chart">
    <defs><linearGradient id="${gid}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="var(--primary)" stop-opacity=".42"/><stop offset="1" stop-color="var(--primary)" stop-opacity="0"/></linearGradient></defs>
    ${grid}${xt}
    ${area ? `<path d="${area}" fill="url(#${gid})"/>` : ""}
    ${trendPath ? `<path d="${trendPath}" fill="none" stroke="var(--fg)" stroke-opacity=".55" stroke-width="1.5" stroke-dasharray="4 3" stroke-linecap="round"/>` : ""}
    <path d="${path}" fill="none" stroke="var(--primary)" stroke-width="2.75" stroke-linejoin="round" stroke-linecap="round"/>
    ${dots}
    ${latestTag}
    <circle data-chart-hl="${esc(id)}" cx="${f1(coords[coords.length-1].x)}" cy="${f1(coords[coords.length-1].y)}" r="6" fill="none" stroke="var(--fg)" stroke-width="1.5" opacity="0"/>
    ${hits}
  </svg>
  <p class="chart-read" data-chart-read="${esc(id)}">${esc(last.read || "")}<span class="muted"> · tap a point</span></p>`;
}
function svgBarChart(id, bars, { unit = "" } = {}){
  if (!bars.length || bars.every(b => !b.y)) return `<p class="chart-empty">No walks in this range.</p>`;
  const W = 240, H = 130, padL = 26, padR = 6, padT = 10, padB = 22;
  const x0 = padL, x1 = W - padR, y0 = padT, y1 = H - padB;
  const hi = Math.max(...bars.map(b => b.y), 0.1);
  const step = niceStep(hi, 3);
  const yMax = Math.ceil(hi / step) * step;
  const Y = (v) => y1 - (v / yMax) * (y1 - y0);
  const f1 = (n) => n.toFixed(1);
  let grid = "";
  for (let v = 0; v <= yMax + step / 2; v += step) {
    grid += `<line x1="${x0}" y1="${f1(Y(v))}" x2="${x1}" y2="${f1(Y(v))}" stroke="var(--border)" stroke-width="0.75"/><text x="${x0 - 4}" y="${f1(Y(v) + 3.5)}" fill="var(--muted)" font-size="9.5" text-anchor="end">${esc(fmtNum(v))}</text>`;
  }
  const slot = (x1 - x0) / bars.length;
  const bw = Math.max(3, Math.min(18, slot * 0.66));
  let out = "", lab = "";
  const labEvery = Math.ceil(bars.length / 4);
  CHART_DATA[id] = [];
  bars.forEach((b, i) => {
    const cx = x0 + slot * (i + 0.5);
    const top = Y(b.y);
    out += `<rect x="${f1(cx - bw / 2)}" y="${f1(top)}" width="${f1(bw)}" height="${f1(Math.max(0, y1 - top))}" rx="2" fill="var(--primary)" fill-opacity="${b.current ? 1 : 0.6}"/>`;
    out += `<rect class="chart-hit" data-act="chart-pt" data-c="${esc(id)}" data-i="${i}" x="${f1(cx - slot / 2)}" y="${y0}" width="${f1(slot)}" height="${f1(y1 - y0)}" fill="transparent"/>`;
    if ((bars.length - 1 - i) % labEvery === 0) lab += `<text x="${f1(cx)}" y="${H - 6}" fill="var(--muted)" font-size="9.5" text-anchor="middle">${esc(b.label)}</text>`;
    CHART_DATA[id].push({ x: cx, y: top, read: b.read });
  });
  const last = bars[bars.length - 1];
  return `<svg class="chart-svg" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(unit)} per week">${grid}${out}${lab}
    <circle data-chart-hl="${esc(id)}" cx="0" cy="0" r="0" opacity="0"/></svg>
  <p class="chart-read" data-chart-read="${esc(id)}">${esc(last.read)}<span class="muted"> · tap a bar</span></p>`;
}
function showChartPoint(id, i){
  const d = CHART_DATA[id]?.[i];
  if (!d) return;
  const read = document.querySelector(`[data-chart-read="${id}"]`);
  if (read) read.textContent = d.read || "";
  const hl = document.querySelector(`[data-chart-hl="${id}"]`);
  if (hl && hl.getAttribute("r") !== "0") { hl.setAttribute("cx", d.x.toFixed(1)); hl.setAttribute("cy", d.y.toFixed(1)); hl.setAttribute("opacity", "1"); }
}
function isoToUtcMs(iso){ const [y, m, d] = String(iso).split("-").map(Number); return Date.UTC(y, (m||1) - 1, d||1); }
function utcMsToIso(ms){ const t = new Date(ms); return `${t.getUTCFullYear()}-${String(t.getUTCMonth()+1).padStart(2,"0")}-${String(t.getUTCDate()).padStart(2,"0")}`; }
function walkWeekBars(){
  const thisMon = isoToUtcMs(mondayOfThisWeekISO());
  const weeks = curRange().walkWeeks;
  const bars = [];
  for (let k = weeks - 1; k >= 0; k--) {
    const start = thisMon - k * 7 * 86400000, end = start + 7 * 86400000;
    const ws = walks.filter(w => { const t = isoToUtcMs(w.date); return t >= start && t < end; });
    const km = ws.reduce((a, w) => a + (Number(w.distanceKm) || 0), 0);
    const min = ws.reduce((a, w) => a + (Number(w.durationSec) || 0), 0) / 60;
    const d = new Date(start);
    const label = `${d.getUTCDate()} ${d.toLocaleString("en-AU",{month:"short",timeZone:"UTC"})}`;
    bars.push({ km, min, n: ws.length, label, current: k === 0, read: `${k === 0 ? "This week" : `Week of ${label}`} · ${ws.length} walk${ws.length === 1 ? "" : "s"} · ${km.toFixed(1)} km · ${Math.round(min)} min` });
  }
  const useKm = bars.some(b => b.km >= 0.05);
  bars.forEach(b => { b.y = useKm ? b.km : b.min; });
  return { bars, unit: useKm ? "km" : "min" };
}
function headline(delta, unit, from, to, good){

  return `<div class="headline"><span class="hl-val" style="color:${col}">${esc(fmtSigned(delta))}${unit ? ` <small>${esc(unit)}</small>` : ""}</span><span class="hl-sub">over ${esc(curRange().desc)} · ${esc(fmtNum(from))} → ${esc(fmtNum(to))}</span></div>`;
}

function renderTimerOnly(){

  const timeText = ui.isGo ? "GO" : fmtTime(ui.remain || active?.rest || 90);

/* ===== How-to guides: figure engine (side/front stick figure, IK, offline) ===== */
const HTK = { TH:29, SH:27, TO:36, UA:22, FA:20, HD:9, HR:7, FT:8, FLOOR:162 };
const HT_PREF = { f:[1,0], b:[-1,0], u:[0,-1], d:[0,1], fu:[.7,-.7], fd:[.7,.7], bu:[-.7,-.7], bd:[-.7,.7] };
function htDir(a){ const r=a*Math.PI/180; return [Math.sin(r), -Math.cos(r)]; }
function htAng(v){ return Math.atan2(v[0], -v[1])*180/Math.PI; }
function htAdd(p,v,k){ return [p[0]+v[0]*k, p[1]+v[1]*k]; }
function htLerp(a,b,u){ return a+(b-a)*u; }
function htLerpAng(a,b,u){ let d=((b-a)%360+540)%360-180; return a+d*u; }
function htIK(root, target, L1, L2, pref){
  const dx=target[0]-root[0], dy=target[1]-root[1], d=Math.hypot(dx,dy)||0.001;
  const dc=Math.min(L1+L2-0.05, Math.max(Math.abs(L1-L2)+0.05, d));
  const a=Math.acos(Math.min(1,Math.max(-1,(L1*L1+dc*dc-L2*L2)/(2*L1*dc))));
  const base=Math.atan2(dy,dx), pv=HT_PREF[pref]||pref||HT_PREF.f;
  const c1=[root[0]+L1*Math.cos(base+a), root[1]+L1*Math.sin(base+a)];
  const c2=[root[0]+L1*Math.cos(base-a), root[1]+L1*Math.sin(base-a)];
  const s=(c)=>(c[0]-root[0])*pv[0]+(c[1]-root[1])*pv[1];
  const j = s(c1)>=s(c2)?c1:c2;
  const jx=target[0]-j[0], jy=target[1]-j[1], jd=Math.hypot(jx,jy)||1;
  return [j, [j[0]+jx/jd*L2, j[1]+jy/jd*L2]];
}
/* point spec: [x,y] absolute | ["n",dx,dy] neck-rel | ["h",dx,dy] hip-rel | ["t",along,front] torso-local */
function htPt(s, J){
  if (typeof s[0]==="number") return s;
  if (s[0]==="n") return [J.neck[0]+s[1], J.neck[1]+s[2]];
  if (s[0]==="h") return [J.hip[0]+s[1], J.hip[1]+s[2]];
  const ax=htDir(J.t), fr=htDir(J.t+90);
  return [J.neck[0]-ax[0]*s[1]+fr[0]*s[2], J.neck[1]-ax[1]*s[1]+fr[1]*s[2]];
}
function htNorm(p){
