<!DOCTYPE html>
<html lang="en">
<head>

  <style>
    :root {
      --bg:#0d0d0d; --surface:#171717; --inset:#141414; --fg:#f3f3f3; --muted:#9a9a9a;
      --primary:#ff4d1c; --primary-fg:#fff; --done:#2ecc71; --miss:#e67e22; --go:#27ae60;

    }
    * { box-sizing: border-box; }
    html, body { margin:0; background:var(--bg); color:var(--fg); font-family:var(--sans); -webkit-font-smoothing:antialiased; }
    button { font: inherit; color: inherit; border:0; background:none; cursor:pointer; }
    button:not(:disabled):active { transform: scale(0.98); }

    header { position:sticky; top:0; z-index:20; background:var(--bg); border-bottom:1px solid var(--border); padding:0.75rem 0 0.625rem; }
    h1 { font-family:var(--display); font-size:1.5rem; letter-spacing:0.1em; margin:0; }
    h2 { font-size:1.125rem; margin:0; line-height:1.3; }
    .muted { color:var(--muted); }
    .row { display:flex; align-items:start; justify-content:space-between; gap:0.75rem; }
    .icon-btn { width:2.75rem; height:2.75rem; display:flex; align-items:center; justify-content:center; border-radius:0.75rem; background:var(--border); flex-shrink:0; }
    .primary { background:var(--primary); color:var(--primary-fg); }
    .install { display:inline-flex; align-items:center; gap:0.4rem; min-height:2.75rem; border-radius:0.75rem; padding:0 0.75rem; font-size:0.875rem; font-weight:600; }
    .sub { margin:0.25rem 0 0; font-size:0.875rem; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .days { display:flex; gap:0.375rem; margin-top:0.625rem; }
    .days button { flex:1; min-height:2.75rem; border-radius:0.75rem; font-size:0.875rem; font-weight:700; background:var(--border); }
    .days button.on { background:var(--primary); color:var(--primary-fg); }
    .timer-bar { margin-top:0.625rem; background:var(--inset); border-radius:1rem; padding:0.5rem 0.75rem; display:flex; align-items:center; justify-content:space-between; gap:0.5rem; box-shadow:0 0 0 1px rgb(243 243 243 / 0.08); }
    .big { font-family:var(--display); font-weight:700; font-variant-numeric:tabular-nums; line-height:1; }
    .card { background:var(--surface); border-radius:1rem; padding:1rem; margin-bottom:0.625rem; box-shadow:0 0 0 1px rgb(243 243 243 / 0.08); }
    .card.active { box-shadow:0 0 0 1px var(--primary); }
    .card.skipped { opacity:0.6; }
    .block { color:var(--primary); font-size:0.75rem; font-weight:700; letter-spacing:0.16em; text-transform:uppercase; margin:1rem 0 0.5rem; }
    .panel { background:var(--surface); border-radius:1rem; padding:1rem; margin-top:0.75rem; box-shadow:0 0 0 1px rgb(243 243 243 / 0.08); }
    .note { color:var(--muted); font-size:0.875rem; margin:0.25rem 0 0; }
    .meta { color:var(--muted); font-size:0.875rem; text-align:right; flex-shrink:0; line-height:1.35; }
    .weight { display:flex; flex-wrap:wrap; align-items:center; gap:0.5rem; margin-top:0.625rem; }
    .kg { min-width:3.5rem; text-align:center; font-size:1.125rem; font-weight:600; font-variant-numeric:tabular-nums; }
    .level { flex:1; min-width:0; text-align:center; font-size:0.875rem; font-weight:600; }
    .rest-box { background:var(--inset); border-radius:0.75rem; padding:0.75rem; margin-top:0.75rem; text-align:center; }
    .cue { height:1.5rem; font-size:1.125rem; font-weight:700; letter-spacing:0.04em; margin:0; }
    .sets { display:flex; gap:0.5rem; margin-top:0.75rem; }
    .sets.tight { gap:0.25rem; }
    .set { flex:1; min-height:4rem; border-radius:0.75rem; background:var(--border); display:flex; flex-direction:column; align-items:center; justify-content:center; padding:0.375rem 0.125rem; touch-action:manipulation; -webkit-user-select:none; user-select:none; -webkit-touch-callout:none; }
    .set.ok { background:var(--done); color:var(--bg); }
    .set.miss { background:var(--miss); color:var(--bg); }
    .set .n { font-weight:700; font-size:0.875rem; }
    .set .r { font-weight:600; font-variant-numeric:tabular-nums; color:var(--muted); font-size:0.75rem; }
    .set.ok .r, .set.miss .r { font-size:1.125rem; line-height:1; color:inherit; }
    .skip { min-height:2.75rem; padding:0 0.375rem; font-size:0.75rem; font-weight:500; letter-spacing:0.04em; color:var(--muted); opacity:0.7; }
    .skip.on { color:var(--primary); opacity:1; }
    .split { display:flex; gap:0.5rem; margin-top:0.75rem; }
    .split button { flex:1; min-height:3rem; border-radius:0.75rem; font-size:1rem; font-weight:700; background:var(--border); display:flex; align-items:center; justify-content:center; gap:0.5rem; }
    .split button.on { background:var(--primary); color:var(--primary-fg); }
    .prog { width:100%; text-align:left; border-radius:0.75rem; padding:0.75rem; background:var(--inset); }
    .prog.on { background:var(--primary); color:var(--primary-fg); }
    .prog span { display:block; }
    .lift { width:100%; min-height:3rem; border-radius:0.75rem; padding:0 0.75rem; text-align:left; font-size:0.875rem; font-weight:600; background:var(--border); }
    .lift.on { background:var(--primary); color:var(--primary-fg); }
    .chips { display:flex; flex-wrap:wrap; gap:0.375rem; }
    .chip { min-height:2.75rem; min-width:2.75rem; border-radius:0.75rem; padding:0 0.75rem; font-size:0.875rem; font-weight:700; background:var(--border); }
    .chip.on { background:var(--primary); color:var(--primary-fg); }
    .picker { background:var(--inset); border-radius:0.75rem; padding:0.75rem; margin-top:0.375rem; }
    .warn { color:var(--warn); }
    .go { color:var(--go); }
    .foot { color:var(--muted); font-size:0.875rem; line-height:1.5; margin-top:0.75rem; }
    .toast { position:fixed; left:50%; bottom:1.5rem; transform:translateX(-50%); background:var(--surface); color:var(--fg); border-radius:0.75rem; padding:0.75rem 1rem; box-shadow:0 0 0 1px rgb(243 243 243 / 0.12); z-index:40; max-width:20rem; font-size:0.875rem; }
    .hide { display:none; }
    svg { width:1rem; height:1rem; stroke:currentColor; fill:none; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; }
    .logo { width:1.5rem; height:1.5rem; color:var(--primary); flex-shrink:0; }
    .head-actions { display:flex; gap:0.375rem; flex-shrink:0; }
    .head-title { display:flex; align-items:center; gap:0.5rem; min-width:0; }
    .rm { display:flex; min-height:3rem; align-items:center; justify-content:space-between; gap:0.5rem; background:var(--inset); border-radius:0.75rem; padding:0 0.75rem; margin-top:0.375rem; }
    .rm button { color:var(--muted); min-height:2.75rem; padding:0 0.5rem; font-size:0.875rem; font-weight:700; }
    .tiny { font-size:0.75rem; font-weight:700; letter-spacing:0.16em; text-transform:uppercase; color:var(--muted); }
    .space { margin-top:0.75rem; }
    .help { background:var(--inset); border-radius:1rem; padding:0.75rem 1rem; margin-top:0.75rem; font-size:0.875rem; color:var(--muted); line-height:1.45; }

    .vol-row input[type=range] { flex:1; min-width:0; height:2rem; accent-color:var(--primary); }
    .vol-lab { min-width:3rem; text-align:right; font-weight:700; font-variant-numeric:tabular-nums; font-size:0.875rem; }
    .cue-list { display:grid; gap:0.5rem; margin-top:0.5rem; }
  </style>
</head>

function bb(id,name,sets,reps,rest,block,extra={}) {
  return {id,name,sets,reps,rest,weight: extra.weight ?? 20, block, ...extra};
}
function bw(id,name,sets,reps,rest,block,extra={}) {

      bb("em-squat","Squats",2,6,75,"Day A",{weight:0,cap:12,note:"Sit to a chair if needed. Hold a plate when 12 is easy."}),

    {label:"A", exercises:[bb("squat","Barbell squat",5,3,180,"T1",{cap:3}), bb("bench","Barbell bench",3,10,120,"T2",{cap:10}), bb("pulldown","Lat pulldown",3,15,75,"T3",{cap:15})]},
    {label:"B", exercises:[bb("ohp","Barbell OHP",5,3,150,"T1",{cap:3}), bb("dl","Deadlift",3,10,150,"T2",{cap:10}), bb("row","Barbell row",3,15,90,"T3",{cap:15})]},
  ]},
  {id:"phraks", name:"Phraks GSLP", blurb:"3×5 full-body. A/B like 5×5, slightly less volume.", days:[
    {label:"A", exercises:[bb("squat","Barbell squat",3,5,180,"Day A",{cap:5}), bb("bench","Barbell bench",3,5,150,"Day A",{cap:5}), bb("row","Barbell row",3,5,120,"Day A",{cap:5})]},
    {label:"B", exercises:[bb("squat","Barbell squat",3,5,180,"Day B",{cap:5}), bb("ohp","Barbell OHP",3,5,150,"Day B",{cap:5}), bb("dl","Deadlift",1,5,180,"Day B",{cap:5})]},
  ]},

    {label:"Pull", exercises:[bb("dl","Deadlift",3,5,180,"Pull",{cap:5}), bb("row","Barbell row",3,8,120,"Pull"), bw("pullup","Pull-ups",3,6,120,"Pull",{nocap:true}), bb("curl","Dumbbell curl",3,10,60,"Pull",{cap:14})]},
    {label:"Legs", exercises:[bb("squat","Barbell squat",3,8,180,"Legs"), bb("rdl","Barbell RDL",3,8,150,"Legs"), bw("lunge","Walking lunge",3,10,90,"Legs",{bilateral:true,cap:14}), bb("calf","Calf raise",3,12,45,"Legs",{cap:20})]},
  ]},

const LIBRARY = [
  {group:"Squat / hinge", lifts:[
    bb("squat","Barbell squat",3,8,120,"Add-on"), bb("front-squat","Front squat",3,6,150,"Add-on"),
    bb("goblet","Goblet squat",3,10,75,"Add-on",{cap:14}), bb("dl","Deadlift",3,5,180,"Add-on",{cap:5}),
    bb("rdl","Barbell RDL",3,8,120,"Add-on"), bb("db-rdl","Dumbbell RDL",3,10,90,"Add-on",{cap:14}),
    bb("single-rdl","Single-leg RDL",3,8,75,"Add-on",{bilateral:true,cap:12}), bb("good-morning","Good morning",3,8,90,"Add-on"),
    bb("kb-swing","Kettlebell swing",3,15,60,"Add-on",{cap:20}), bb("hip-thrust","Hip thrust",3,10,75,"Add-on",{cap:14}),
    bw("glute-bridge","Glute bridge",3,12,45,"Add-on",{cap:20}), bw("bext","Back extension",3,10,75,"Add-on",{cap:14}),
  ]},
  {group:"Push", lifts:[
    bb("bench","Barbell bench",3,8,150,"Add-on"), bb("incline","Incline bench",3,8,120,"Add-on"),
    bb("floor-press","Floor press",3,8,120,"Add-on"), bb("db-bench","Dumbbell bench",3,10,90,"Add-on"),
    bb("ohp","Barbell OHP",3,8,90,"Add-on"), bb("db-ohp","Dumbbell OHP",3,8,90,"Add-on"),
    bw("pu","Push-ups",3,15,75,"Add-on",{nocap:true}), bw("close-pu","Close-grip push-ups",3,12,75,"Add-on",{nocap:true}),
    bw("pike-pu","Pike push-up",3,8,75,"Add-on",{nocap:true}), bw("dip","Dips",3,8,90,"Add-on",{nocap:true}),

    bw("band-pull","Band pull-apart",3,15,45,"Add-on",{cap:20}), bb("facepull","Face pulls",3,12,45,"Add-on",{cap:16}),

  ]},

    bw("plank","Plank",3,30,45,"Add-on",{cap:60,note:"Seconds, not reps"}),

    bw("psoas","Psoas march",3,8,45,"Add-on",{bilateral:true,cap:12}),
    bw("lmr","Landmine rotation",3,8,60,"Add-on",{bilateral:true,cap:12}),
    bw("abd","Side-lying abduction",3,12,45,"Add-on",{bilateral:true,cap:16,note:"Extra on the right"}),

function getProgram(id){ return PROGRAMS.find(p=>p.id===id) || PROGRAMS[0]; }
function blankSets(n){ return Array.from({length:n},()=>({ok:false,miss:false})); }
function toExercise(d){
  return {...d, streak:0, failStreak:0, levelIndex: d.levels?.length ? (d.levelIndex??0) : d.levelIndex, setsLog: blankSets(d.sets)};
}
function seedProgram(id, day=0){
  const p = getProgram(id);
  const d = p.days[Math.min(Math.max(0,day), p.days.length-1)];
  return d.exercises.map(toExercise);
}
function captureProgress(exs, prev={}){
  const next = {...prev};
  for (const ex of exs) next[ex.id] = {reps:ex.reps, weight:ex.weight, streak:ex.streak, failStreak:ex.failStreak, levelIndex:ex.levelIndex};
  return next;
}
function applyProgress(exs, progress){
  return exs.map(ex => {
    const p = progress[ex.id];
    if (!p) return ex;
    return {...ex, reps:p.reps, weight:p.weight, streak:p.streak, failStreak:p.failStreak, levelIndex:p.levelIndex ?? ex.levelIndex};
  });
}
function hydrate(raw){
  if (!raw?.length) return null;
  const next = [];
  for (const e of raw) {
    if (!e.id || !e.name) continue;
    const sets = e.sets ?? 3;
    next.push({
      id:e.id, name:e.name, sets, rest:e.rest??90, weight:e.weight??0, reps:e.reps??8,
      bw:e.bw, nocap:e.nocap, cap:e.cap, block:e.block??"Session", bilateral:e.bilateral, note:e.note,

function markSet(ei, si){
  state.exercises = state.exercises.map((ex,i) => {
    if (i!==ei) return ex;
    const target = ex.reps;
    const max = maxRep(ex);
    const log = ex.setsLog.map((s,j) => {
      if (j!==si) return s;
      const logged = s.ok || s.miss;
      if (!logged) return {ok:true, miss:false, reps:target};
      const current = s.reps ?? target;
      if (s.miss) {
        if (current <= 1) return {ok:false, miss:false};
        return {ok:false, miss:true, reps:current - 1};
      }
      // ok path: bump reps up to max, then clear
      if (current < max) return {ok:true, miss:false, reps:current + 1};
      return {ok:false, miss:false};
    });
    return {...ex, skipped:false, setsLog:log};
  });
  save(); render();
}
function markSetMiss(ei, si){
  state.exercises = state.exercises.map((ex,i) => {
    if (i!==ei) return ex;
    const target = ex.reps;
    const log = ex.setsLog.map((s,j) => {
      if (j!==si) return s;
      const logged = s.ok || s.miss;
      if (!logged) {
        const missReps = Math.max(0, target - 1);
        return {ok:false, miss:true, reps:missReps};
      }
      if (s.ok) {
        const missReps = Math.min(s.reps ?? target, Math.max(0, target - 1));
        if (missReps < 1 && target <= 1) return {ok:false, miss:true, reps:0};
        return {ok:false, miss:true, reps:Math.max(0, missReps)};
      }
      // already miss → clear
      return {ok:false, miss:false};
    });
    return {...ex, skipped:false, setsLog:log};
  });
  save(); render();
}
function bumpWeight(ei, d){
  state.exercises = state.exercises.map((ex,i) => i===ei ? {...ex, weight: Math.max(0, +(ex.weight+d).toFixed(1))} : ex);
  state.liftProgress = captureProgress(state.exercises, state.liftProgress);

}
function bumpLevel(ei, d){

}

function logSession(){
  const notes = [];
  const exercises = state.exercises.map(ex => {
    const touched = ex.setsLog.some(s => s.ok || s.miss);
    if (ex.skipped || !touched) {
      if (ex.skipped) notes.push(`${ex.name}: skipped`);
      return {...ex, skipped:false, setsLog: blankSets(ex.sets)};
    }
    const all = ex.setsLog.every(s => s.ok || s.miss);
    // Enforce: ok only when reps >= target; otherwise treat as miss
    const setsLog = ex.setsLog.map(s => {
      if (!s.ok && !s.miss) return s;
      const r = s.reps ?? ex.reps;
      if (r >= ex.reps) return {ok:true, miss:false, reps:r};
      return {ok:false, miss:true, reps:r};
    });
    const clean = all && setsLog.every(s => s.ok && !s.miss);
    if (!all) { notes.push(`${ex.name}: incomplete`); return {...ex, setsLog: blankSets(ex.sets)}; }
    if (!clean) {
      let failStreak = (ex.failStreak||0)+1;
      let {reps, weight} = ex;
      if (failStreak >= 3) {
        failStreak = 0;
        if (ex.bw) {
          if (weight > 0) {
            weight = Math.max(0, +(weight-2.5).toFixed(1));
            notes.push(`${ex.name}: RESET WEEK — ${weight} kg × ${reps}`);
          } else {
            if (reps>6) reps-=2;
            notes.push(`${ex.name}: RESET WEEK — reps back to ${reps}`);
          }
        } else {
          weight = Math.max(0, +(weight-2.5).toFixed(1));
          if (ex.cap) notes.push(`${ex.name}: RESET WEEK — ${weight} kg × ${reps}`);
          else { if (reps>8) reps-=2; notes.push(`${ex.name}: RESET WEEK — ${weight} kg × ${reps}`); }
        }
      } else notes.push(`${ex.name}: no-rep ${failStreak}/3 — stay at ${reps}`);
      return {...ex, streak:0, failStreak, reps, weight, setsLog: blankSets(ex.sets)};
    }
    const minLogged = Math.min(...setsLog.map(s => s.reps ?? ex.reps));
    let {reps, weight} = ex;
    let levelIndex = ex.levelIndex ?? 0;
    // Carry-forward: all sets clean above target → raise range immediately
    if (minLogged > ex.reps) {
      reps = minLogged;
      notes.push(`${ex.name}: target → ${reps} (from logged sets)`);
      return {...ex, streak:1, failStreak:0, reps, weight, levelIndex, setsLog: blankSets(ex.sets)};
    }
    let streak = ex.streak+1;
    if (streak >= 3) {
      streak = 0;
      if (ex.levels?.length) {
        const last = levelIndex >= ex.levels.length-1;
        if (!last && reps >= (ex.cap||10)) { levelIndex += 1; reps = 5; notes.push(`${ex.name}: ${ex.levels[levelIndex]} · start at ${reps}`); }
        else { reps += 2; notes.push(`${ex.name}: reps → ${reps} · ${ex.levels[levelIndex]}`); }
      } else if (ex.bw) {
        if (ex.nocap || reps < (ex.cap||16)) { reps += 2; notes.push(`${ex.name}: reps → ${reps}`); }
        else { weight = +(weight+2.5).toFixed(1); notes.push(`${ex.name}: +2.5kg → ${weight}`); }
      } else if (ex.cap && reps >= ex.cap) { weight = +(weight+2.5).toFixed(1); notes.push(`${ex.name}: +2.5kg → ${weight}`); }
      else if (reps >= 12) { reps = 8; weight = +(weight+2.5).toFixed(1); notes.push(`${ex.name}: +2.5kg → ${weight}, reps 8`); }
      else { reps += 2; notes.push(`${ex.name}: reps → ${reps}`); }
    } else notes.push(`${ex.name}: clean ${streak}/3 at ${reps}`);
    return {...ex, streak, failStreak:0, reps, weight, levelIndex, setsLog: blankSets(ex.sets)};
  });
  state.exercises = exercises;
  state.liftProgress = captureProgress(exercises, state.liftProgress);
  state.history = [{date:new Date().toISOString(), notes}, ...state.history].slice(0,30);
  save();
  return notes;
}

function render(){
  const program = getProgram(state.programId);
  const ci = currentIndex(state.exercises);
  const active = state.exercises[ci];
  const timerOn = ui.running || ui.remain>0 || ui.isGo;
  const timeText = ui.isGo ? "GO" : fmtTime(ui.remain || active?.rest || 90);
  const timeClass = ui.isGo ? "go" : (ui.remain>0 && ui.remain<=3 ? "warn" : "");
  const doneSets = state.exercises.reduce((n,ex) => n + (ex.skipped ? ex.sets : ex.setsLog.filter(s=>s.ok||s.miss).length), 0);
  const totalSets = state.exercises.reduce((n,ex) => n+ex.sets, 0);
  const inSession = new Set(state.exercises.map(e=>e.id));
  const sub = `${program.name}${program.days.length>1 ? ` · ${program.days[state.dayIndex]?.label}` : ""} · ${doneSets}/${totalSets} sets`;

  let lastBlock = "";
  const cards = state.exercises.map((ex, ei) => {
    const showTag = ex.block !== lastBlock;
    lastBlock = ex.block;
    const isActive = ei===ci && !ex.skipped;
    const tight = ex.sets > 3;
    const loggedCue = isActive && ui.remain>0 && ui.remain<=3 && !ui.isGo ? String(ui.remain) : (isActive && ui.isGo ? "GO" : "");
    const remainText = isActive ? timeText : fmtTime(ex.rest);
    const tClass = isActive ? timeClass : "";
    const level = ex.levels?.length ? ex.levels[ex.levelIndex??0] : null;
    const weightCtrl = `<button class="icon-btn" data-act="weight" data-i="${ei}" data-d="-2.5" aria-label="Decrease weight">${I.minus}</button>
           <span class="kg">${ex.weight}</span>
           <button class="icon-btn" data-act="weight" data-i="${ei}" data-d="2.5" aria-label="Increase weight">${I.plus}</button>
           <span class="muted" style="font-size:.875rem">kg</span>`;
    const load = ex.levels?.length
      ? `<button class="icon-btn" data-act="level" data-i="${ei}" data-d="-1" aria-label="Easier height">${I.minus}</button>
         <span class="level">${esc(level)}</span>
         <button class="icon-btn" data-act="level" data-i="${ei}" data-d="1" aria-label="Harder height">${I.plus}</button>
         <span style="flex-basis:100%;height:0" aria-hidden="true"></span>
         ${weightCtrl}`
      : weightCtrl;
    const sets = ex.skipped ? "" : `<div class="sets${tight?" tight":""}">${ex.setsLog.map((log,si) => {
      const logged = log.ok || log.miss;
      const shown = logged ? (log.reps ?? ex.reps) : ex.reps;
      const cls = log.ok ? "ok" : log.miss ? "miss" : "";
      return `<button class="set ${cls}" data-act="set" data-i="${ei}" data-s="${si}">
        <span class="n">${tight?`S${si+1}`:`Set ${si+1}`}</span>
        <span class="r">${ex.bilateral?`${shown} ea`:shown}</span>
      </button>`;
    }).join("")}</div>`;
    return `${showTag?`<p class="block">${esc(ex.block)}</p>`:""}
      <article class="card${isActive?" active":""}${ex.skipped?" skipped":""}" id="ex-${esc(ex.id)}">
        <div class="row">
          <div>
            <h2>${esc(ex.name)}</h2>
            ${ex.note?`<p class="note">${esc(ex.note)}</p>`:""}
            ${ex.skipped?`<p class="note">Skipped — won’t count</p>`:""}
          </div>
          <p class="meta">${esc(targetLabel(ex))}<br>${ex.streak}/3 clean · ${ex.failStreak}/3 no-rep</p>
        </div>
        <div class="weight">${load}</div>
        ${isActive?`<div class="rest-box"><p class="cue" data-cue>${loggedCue}</p><p class="big ${tClass}" data-timer style="font-size:3rem">${remainText}</p>
          <div class="split" style="justify-content:center;margin-top:.625rem"><button class="icon-btn" data-act="rest" data-d="-15" aria-label="Minus 15 seconds">−</button>
          <button class="icon-btn" data-act="rest" data-d="15" aria-label="Plus 15 seconds">+</button></div></div>`:""}
        ${sets}
        <div style="margin-top:.25rem;display:flex;justify-content:flex-end">
          <button class="skip${ex.skipped?" on":""}" data-act="skip" data-i="${ei}">${ex.skipped?"Unskip":"Skip"}</button>
        </div>
      </article>`;
  }).join("");

  const days = program.days.length>1
    ? `<div class="days">${program.days.map((d,i)=>`<button class="${i===state.dayIndex?"on":""}" data-act="day" data-d="${i}">${esc(d.label)}</button>`).join("")}</div>`
    : "";

  const history = ui.panel==="history" ? `<section class="panel"><p class="tiny">Session log</p>${
    state.history.length===0 ? `<p class="note">No sessions yet. Tick every set, then log.</p>`
    : `<ol style="margin:.5rem 0 0;padding:0;list-style:none">${state.history.slice(0,8).map(h=>`<li style="margin-top:.75rem"><p style="margin:0;font-size:.875rem;font-weight:600">${esc(fmtWhen(h.date))}</p><p class="note">${esc(h.notes.join(" · "))}</p></li>`).join("")}</ol>`
  }</section>` : "";

  const programs = ui.panel==="programs" ? `<section class="panel"><p class="tiny">Swap program</p><ul style="margin:.75rem 0 0;padding:0;list-style:none;display:grid;gap:.5rem">${
    PROGRAMS.map(p=>`<li><button class="prog${p.id===state.programId?" on":""}" data-act="program" data-id="${p.id}"><span style="font-size:1rem;font-weight:700">${esc(p.name)}</span><span class="note" style="${p.id===state.programId?"opacity:.8;color:inherit":""}">${esc(p.blurb)}</span></button></li>`).join("")
  }</ul></section>` : "";

  const remove = ui.panel==="remove" ? `<section class="panel"><p class="tiny">This session</p>${
    state.exercises.map(ex=>`<div class="rm"><span style="font-size:.875rem;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(ex.name)}</span><button data-act="remove" data-id="${esc(ex.id)}" data-name="${esc(ex.name)}">Remove</button></div>`).join("")
  }</section>` : "";

  const add = ui.panel==="add" ? `<section class="panel"><p class="tiny">Add a lift</p>${
    LIBRARY.map(group => {
      const lifts = group.lifts.filter(l => !inSession.has(l.id));
      if (!lifts.length) return "";
      return `<div class="space"><p class="block" style="margin:0 0 .5rem">${esc(group.group)}</p>${lifts.map(lift => {
        const open = ui.pending?.id === lift.id;
        const opts = REP_OPTS.includes(lift.reps) ? REP_OPTS : [...REP_OPTS, lift.reps].sort((a,b)=>a-b);
        const lab = lift.note?.includes("Seconds") ? "Secs" : lift.note?.includes("Metres") ? "Metres" : "Reps";
        return `<div style="margin-top:.375rem"><button class="lift${open?" on":""}" data-act="pick" data-id="${lift.id}">${esc(lift.name)}</button>${
          open ? `<div class="picker"><p class="tiny" style="margin-bottom:.375rem">Sets</p><div class="chips">${SET_OPTS.map(n=>`<button class="chip${n===ui.pickSets?" on":""}" data-act="sets" data-n="${n}">${n}</button>`).join("")}</div>
            <p class="tiny" style="margin:.75rem 0 .375rem">${lab}</p><div class="chips">${opts.map(n=>`<button class="chip${n===ui.pickReps?" on":""}" data-act="reps" data-n="${n}">${n}</button>`).join("")}</div>
            <button class="split" style="width:100%;margin-top:.75rem"><span class="primary" style="display:flex;width:100%;min-height:2.75rem;border-radius:.75rem;align-items:center;justify-content:center;font-weight:700" data-act="confirm-add">Add ${ui.pickSets}×${ui.pickReps}</span></button></div>` : ""
        }</div>`;
      }).join("")}</div>`;
    }).join("")
  }</section>` : "";

  const volPct = Math.round(clampVolume(state.soundVolume) * 100);
  const sound = ui.panel==="sound" ? `<section class="panel"><p class="tiny">Sound</p>
    <p class="tiny" style="margin-top:.75rem;letter-spacing:.08em">Volume</p>
    <div class="vol-row"><input type="range" min="0" max="100" step="1" value="${volPct}" data-act="vol" aria-label="Sound volume" /><span class="vol-lab" data-vol-label>${volPct}%</span></div>
    <p class="tiny" style="margin-top:.875rem;letter-spacing:.08em">Rest cues</p>
    <div class="cue-list">${Object.values(CUE_PACKS).map(p=>`<button class="prog${p.id===state.cuePack?" on":""}" data-act="cue-pack" data-id="${p.id}"><span style="font-size:1rem;font-weight:700">${esc(p.name)}</span><span class="note" style="${p.id===state.cuePack?"opacity:.8;color:inherit":""}">${esc(p.blurb)}</span></button>`).join("")}</div>
    <button class="split" style="width:100%;margin-top:.75rem"><span class="primary" style="display:flex;width:100%;min-height:2.75rem;border-radius:.75rem;align-items:center;justify-content:center;font-weight:700;gap:.5rem" data-act="preview-sound">${I.sound} Preview</span></button>
    <p class="note" style="margin-top:.75rem">Cues fire on the last 3 seconds of rest. Beeps only skips voice. Volume 0 mutes beeps and speech.</p>
  </section>` : "";

  const isFile = location.protocol === "file:";
  const hint = isFile
    ? `<div class="help">This file can’t stay on the home screen. Open the web link in Chrome or Safari, then tap <b style="color:var(--fg)">Install</b>.</div>`
    : (ui.installHint && !ui.installed ? `<div class="help">iPhone: Share → <b style="color:var(--fg)">Add to Home Screen</b>. Android: Chrome menu → <b style="color:var(--fg)">Add to Home screen</b>.</div>` : "");

  document.getElementById("app").innerHTML = `
    <header>
      <div class="row">
        <div style="min-width:0">
          <div class="head-title">${I.anvil}<h1>${esc(program.name)}</h1></div>
          <p class="sub muted">${esc(sub)}</p>
        </div>
        <div class="head-actions">
          ${ui.installed ? "" : `<button class="install primary" data-act="install">${I.phone} Install</button>`}
          <button class="icon-btn" data-act="panel" data-p="sound" aria-label="Sound">${I.sound}</button>
          <button class="icon-btn" data-act="panel" data-p="programs" aria-label="Programs">${I.layers}</button>
          <button class="icon-btn" data-act="panel" data-p="history" aria-label="History">${I.clock}</button>
        </div>
      </div>
      ${days}
      ${timerOn?`<div class="timer-bar"><div><p class="note" id="timer-bar-label" style="margin:0">${esc((ui.running||ui.remain>0)?`Rest · ${active?.name??""}`:(active?.name??""))}</p>
        <p class="big ${timeClass}" data-timer style="font-size:1.875rem">${timeText}</p></div>
        <div style="display:flex;gap:.375rem"><button class="icon-btn" data-act="rest" data-d="-15">−</button>
        <button class="icon-btn" data-act="rest" data-d="15">+</button></div></div>`:""}
    </header>
    ${hint}
    ${history}
    ${programs}
    <div class="space">${cards}</div>
    <div class="split">
      <button class="${ui.panel==="add"?"on":""}" data-act="panel" data-p="add">${I.plus} Add</button>
      <button class="${ui.panel==="remove"?"on":""}" data-act="panel" data-p="remove">${I.minus} Remove</button>
      <button class="${ui.panel==="sound"?"on":""}" data-act="panel" data-p="sound">${I.sound} Sound</button>
    </div>
    ${remove}
    ${add}
    ${sound}
    <div class="split">
      <button class="primary" data-act="log">Log session</button>
      <button data-act="reset">${I.reset} Reset</button>
    </div>
    <div class="split">
      <button data-act="export">Export</button>
      <button data-act="import">Import</button>
    </div>
    <p class="foot">Tap a set to log the target, then tap again to add reps up to the cap (or soft max). Tap at max clears the set. Long-press a set for a miss (below target); tap a miss to drop reps, then clear. Leave a lift blank or skip — it won’t count. All sets clean above target → next session uses that min. Exactly at target: 3 clean → +2 reps (or +2.5 kg at cap / on 5×5-style lifts; bodyweight lifts use the same kg steppers for added load). 3 short sessions → reset week (drop kg first if loaded).</p>
  `;
}

document.addEventListener("pointerdown", unlockAudio, {once:true});
let setPressTimer = null;
let setPressFired = false;
const SET_LONG_MS = 400;
function clearSetPress(){
  if (setPressTimer) { clearTimeout(setPressTimer); setPressTimer = null; }
}
document.getElementById("app").addEventListener("pointerdown", (e) => {
  const btn = e.target.closest("[data-act=set]");
  if (!btn || (e.button != null && e.button !== 0)) return;
  clearSetPress();
  setPressFired = false;
  const ei = +btn.dataset.i, si = +btn.dataset.s;
  try { btn.setPointerCapture(e.pointerId); } catch (_) {}
  setPressTimer = setTimeout(() => {
    setPressTimer = null;
    setPressFired = true;
    onMarkMiss(ei, si);
  }, SET_LONG_MS);
});
document.getElementById("app").addEventListener("pointerup", clearSetPress);
document.getElementById("app").addEventListener("pointercancel", clearSetPress);
document.getElementById("app").addEventListener("lostpointercapture", clearSetPress);
document.getElementById("app").addEventListener("contextmenu", (e) => {
  if (e.target.closest("[data-act=set]")) e.preventDefault();
});
document.getElementById("app").addEventListener("input", (e) => {
  const el = e.target.closest("[data-act=vol]");
  if (!el) return;
  state.soundVolume = clampVolume((+el.value) / 100);
  save();
  const lab = document.querySelector("[data-vol-label]");
  if (lab) lab.textContent = `${Math.round(state.soundVolume * 100)}%`;
});
document.getElementById("app").addEventListener("click", (e) => {
  const btn = e.target.closest("[data-act]");
  if (!btn) return;
  const act = btn.dataset.act;
  if (act==="set") {
    if (setPressFired) { setPressFired = false; return; }
    onMark(+btn.dataset.i, +btn.dataset.s);
  }
  else if (act==="weight") bumpWeight(+btn.dataset.i, +btn.dataset.d);
  else if (act==="level") bumpLevel(+btn.dataset.i, +btn.dataset.d);
  else if (act==="skip") { const ei=+btn.dataset.i; skipExercise(ei); if (ei===currentIndex(state.exercises)) { stopRest(); render(); } }
  else if (act==="rest") adjustRest(+btn.dataset.d);
  else if (act==="day") { setDay(+btn.dataset.d); stopRest(); render(); }
  else if (act==="program") { setProgram(btn.dataset.id, 0); stopRest(); ui.panel="none"; toast(`${getProgram(btn.dataset.id).name} loaded`); render(); }
  else if (act==="panel") { const next=btn.dataset.p; const opening=ui.panel!==next; ui.panel=opening?next:"none"; if (!opening || next!=="add") ui.pending=null; render(); }
  else if (act==="remove") { if (!removeExercise(btn.dataset.id)) toast("Keep at least one lift"); else toast(`${btn.dataset.name} removed`); render(); }
  else if (act==="pick") {
    const lift = LIBRARY.flatMap(g=>g.lifts).find(l=>l.id===btn.dataset.id);
    if (!lift) return;
    if (ui.pending?.id===lift.id) ui.pending=null;
    else { ui.pending=lift; ui.pickSets=lift.sets; ui.pickReps=lift.reps; }
    render();
  }
  else if (act==="sets") { ui.pickSets=+btn.dataset.n; render(); }
  else if (act==="reps") { ui.pickReps=+btn.dataset.n; render(); }
  else if (act==="confirm-add") {
    if (!ui.pending) return;
    const ok = addExercise({...ui.pending, sets:ui.pickSets, reps:ui.pickReps});
    if (!ok) toast("Already in the session");
    else { toast(`${ui.pending.name} · ${ui.pickSets}×${ui.pickReps}`); ui.pending=null; }
    render();
  }
  else if (act==="log") onLog();
  else if (act==="reset") resetChecks();
  else if (act==="export") exportBackup();
  else if (act==="import") importBackup();
  else if (act==="cue-pack") { state.cuePack = normalizeCuePack(btn.dataset.id); save(); render(); }
  else if (act==="preview-sound") previewSound();
  else if (act==="vol") {
    state.soundVolume = clampVolume((+btn.value) / 100);
    save();
    const lab = document.querySelector("[data-vol-label]");
    if (lab) lab.textContent = `${Math.round(state.soundVolume * 100)}%`;
  }
  else if (act==="install") {
    if (location.protocol === "file:") {
      ui.installHint = true;
      toast("Use the web link", "Open ANVIL in Chrome or Safari from the link, then tap Install. A downloaded file won’t stay on the home screen.");
      render();
    } else if (deferredInstall) {
      deferredInstall.prompt();
      deferredInstall.userChoice.then((r) => {
        if (r.outcome === "accepted") { deferredInstall = null; ui.installed = true; }
        render();
      });
    } else {
      ui.installHint = true;
      toast("Add to Home screen", "iPhone: Share → Add to Home Screen. Android: Chrome menu → Add to Home screen.");
      render();
    }
  }
});

try {
  load();
  render();
} catch {
  try { localStorage.removeItem(STORAGE); } catch {}
  state = { programId:"anvil", dayIndex:0, exercises: seedProgram("anvil", 0), history:[], liftProgress:{}, soundVolume:0.7, cuePack:"classic" };
  try { render(); } catch {}
}
if (location.protocol.startsWith("http") && "serviceWorker" in navigator) {
  navigator.serviceWorker.register(new URL("sw.js", location.href).href).catch(() => {});
}
</script>
</body>
</html>
