  if (HOWTO[ex.id]) return ex.id;
  return HOWTO_ALIAS[ex.id] || null;
}
function howtoAnimFor(ex, g){
  if (!g) return null;
  const li = ex.levelIndex ?? 0;
  if (ex.benchLadder && li === 0) return "benchplate";
  if (g.stageAnim && g.stageAnim[li]) return g.stageAnim[li];
  return HOWTO_ANIM_OVERRIDE[ex.id] || g.anim;
}
function htReduced(){ try { return matchMedia("(prefers-reduced-motion: reduce)").matches; } catch { return false; } }
function htList(items, cls){ return `<ul class="ht-list ${cls}">${items.map(t=>`<li>${esc(t)}</li>`).join("")}</ul>`; }
function openHowto(ei){
  const ex = state.exercises?.[ei];
  if (!ex) return;
  const key = howtoKey(ex), g = key ? HOWTO[key] : null;
  const animKey = howtoAnimFor(ex, g);
  const def = HT_ANIMS[animKey] || HT_ANIMS.stand;
  const custom = !!HT_ANIMS[animKey];
  const reduced = htReduced();
  const fig = (inner)=>`<svg class="ht-fig" viewBox="${htBox(def)}" role="img" aria-label="${esc(ex.name)} demo">${inner}</svg>`;
  let figHtml;
  if (reduced) {
    const P = def._p, end = P.length>1 ? 1 : 0;
    figHtml = `<div class="ht-static"><div>${fig(htSVG(P[0],P[0],0,def))}<span>Start</span></div><div>${fig(htSVG(P[end],P[end],0,def))}<span>${custom?"End":"Hold"}</span></div></div>`;
  } else figHtml = fig(htFrame(def, 0));
  const ladderKind = g?.ladder || (ex.benchLadder ? "bench" : ex.cossackLadder ? "cossack" : ex.heaveLadder ? "heave" : null);
  let ladder = "";
  if (ladderKind && HOWTO_LADDERS[ladderKind] && (ex.cossackLadder || ex.heaveLadder || ex.benchLadder)) {
    const li = ex.levelIndex ?? 0;
    ladder = `<h3 class="ht-h">Ladder</h3><ol class="ht-ladder">${HOWTO_LADDERS[ladderKind]().map((s,i)=>`<li class="${i===li?"on":i<li?"done":""}"><span class="ht-step">${i<li?"✓":i+1}</span><span><b>${esc(s.name)}</b>${i===li?` <em>Now</em>`:""}<br><small>${esc(s.note)}</small></span></li>`).join("")}</ol>`;
  } else if (ex.levels?.length) {
    const li = ex.levelIndex ?? 0;
    ladder = `<h3 class="ht-h">Levels</h3><ol class="ht-ladder">${ex.levels.map((n,i)=>`<li class="${i===li?"on":i<li?"done":""}"><span class="ht-step">${i<li?"✓":i+1}</span><span><b>${esc(n)}</b>${i===li?` <em>Now</em>`:""}</span></li>`).join("")}</ol>`;
  }
  const body = g ? `
      <h3 class="ht-h">Form cues</h3>${htList(g.cues,"cues")}
      <h3 class="ht-h">Common mistakes</h3>${htList(g.mistakes,"miss")}
      <div class="ht-two"><div><h3 class="ht-h">Easier</h3>${htList(g.easier,"vari")}</div><div><h3 class="ht-h">Harder</h3>${htList(g.harder,"vari")}</div></div>`
    : `<p class="note" style="margin-top:.75rem">No detailed guide for this lift yet.</p>`;
  const root = document.getElementById("howto");
  root.innerHTML = `<div class="ht-back" data-ht="close"></div>
    <section class="ht-sheet" role="dialog" aria-modal="true" aria-labelledby="ht-title">
      <div class="ht-grab" aria-hidden="true"></div>
      <div class="ht-head"><h2 id="ht-title">${esc(ex.name)}</h2><button type="button" class="icon-btn" data-ht="close" aria-label="Close guide">✕</button></div>
      ${ex.note?`<p class="note">${esc(ex.note)}</p>`:""}
      <div class="ht-anim">${figHtml}${custom?"":`<span class="ht-tag">General guide</span>`}</div>
      ${ladder}${body}
    </section>`;
  root.classList.add("on");
  document.body.style.overflow = "hidden";
  htOpen = { def, raf:0, t0:performance.now(), reduced, svg: root.querySelector(".ht-anim svg") };
  if (!reduced && custom) {
    const tick = (now) => { if (!htOpen) return; htOpen.svg.innerHTML = htFrame(htOpen.def, now - htOpen.t0); htOpen.raf = requestAnimationFrame(tick); };
    htOpen.raf = requestAnimationFrame(tick);
  }
  try { history.pushState({howto:1}, ""); htOpen.pushed = true; } catch {}
  root.querySelector(".ht-head .icon-btn")?.focus({preventScroll:true});
}
function closeHowto(fromPop){
  if (!htOpen) return;
  cancelAnimationFrame(htOpen.raf);
  const pushed = htOpen.pushed;
  htOpen = null;
  const root = document.getElementById("howto");
  root.classList.remove("on");
  root.innerHTML = "";
  document.body.style.overflow = "";
  if (pushed && !fromPop && history.state?.howto) { try { history.back(); } catch {} }
}
document.getElementById("howto").addEventListener("click", (e) => { if (e.target.closest("[data-ht=close]")) closeHowto(); });
document.addEventListener("keydown", (e) => {
  if (e.key === "Escape" && htOpen) { closeHowto(); return; }
  const n = e.target.closest?.("[data-act=howto]");
  if (n && (e.key === "Enter" || e.key === " ")) { e.preventDefault(); e.stopPropagation(); openHowto(+n.dataset.i); }
}, true);
window.addEventListener("popstate", () => { if (htOpen) closeHowto(true); });

document.getElementById("app").addEventListener("click", (e) => {
  const btn = e.target.closest("[data-act]");
  if (!btn) return;
  const act = btn.dataset.act;
  if (act==="howto") { e.preventDefault(); e.stopPropagation(); openHowto(+btn.dataset.i); return; }
  if (act==="set") {
    onMark(+btn.dataset.i, +btn.dataset.s);
  }
  else if (act==="set-rep") {
    e.stopPropagation();
    bumpSetReps(+btn.dataset.i, +btn.dataset.s, +btn.dataset.d);
  }
  else if (act==="toggle-ex") {
    toggleExExpand(+btn.dataset.i);
  }
  else if (act==="weight") bumpWeight(+btn.dataset.i, +btn.dataset.d);
  else if (act==="level") bumpLevel(+btn.dataset.i, +btn.dataset.d);
  else if (act==="skip") { const ei=+btn.dataset.i; skipExercise(ei); if (ei===currentIndex(state.exercises)) { stopRest(); render(); } }
  else if (act==="rest") adjustRest(+btn.dataset.d);
  else if (act==="chart-pt") showChartPoint(btn.dataset.c, +btn.dataset.i);
  else if (act==="progress-range") { if (PROGRESS_RANGES[btn.dataset.r]) { ui.progressRange = btn.dataset.r; render(); } }
  else if (act==="day") { setDay(+btn.dataset.d); stopRest(); render(); }
  else if (act==="program") { setProgram(btn.dataset.id, 0); stopRest(); ui.panel="none"; toast(`${getProgram(btn.dataset.id).name} loaded`); render(); }
  else if (act==="settings-tab") { const tab=btn.dataset.tab; if (["program","sound","history","progress","backup","about"].includes(tab)) { ui.settingsTab=tab; render(); } }
  else if (act==="main-tab") {
    const tab = btn.dataset.tab;
    if (tab === "workout" || tab === "walk") {
      ui.mainTab = tab;
      if (tab !== "workout") { ui.panel = ui.panel === "add" || ui.panel === "remove" ? "none" : ui.panel; }
      render();
    }
  }
  else if (act==="walk-toggle") { toggleWalk(); }
  else if (act==="panel") { const next=btn.dataset.p; const opening=ui.panel!==next; ui.panel=opening?next:"none"; if (!opening || next!=="add") ui.pending=null; render(); }
  else if (act==="remove") { if (!removeExercise(btn.dataset.id)) toast("Keep at least one lift"); else toast(`${btn.dataset.name} removed`); render(); }
  else if (act==="pick") {
    const lift = LIBRARY.flatMap(g=>g.lifts).find(l=>l.id===btn.dataset.id);
    if (!lift) return;
    if (ui.pending?.id===lift.id) ui.pending=null;
    else { ui.pending=lift; ui.pickSets=lift.sets; ui.pickReps=lift.reps; }
    render();
  }
  else if (act==="sets") { ui.pickSets=+btn.dataset.n; render(); }
  else if (act==="reps") { ui.pickReps=+btn.dataset.n; render(); }
  else if (act==="confirm-add") {
    if (!ui.pending) return;
    const ok = addExercise({...ui.pending, sets:ui.pickSets, reps:ui.pickReps});
    if (!ok) toast("Already in the session");
    else { toast(`${ui.pending.name} · ${ui.pickSets}×${ui.pickReps}`); ui.pending=null; }
    render();
  }
  else if (act==="log") onLog();
  else if (act==="reset") resetChecks();
  else if (act==="export") exportBackup();
  else if (act==="import") importBackup();
  else if (act==="sync-now") syncNow(true);
  else if (act==="check-update") checkForUpdate();
  else if (act==="apply-update") applyUpdate();
  else if (act==="cue-pack") { state.cuePack = normalizeCuePack(btn.dataset.id); save(); render(); }
  else if (act==="preview-sound") previewSound();
  else if (act==="vol") {
    state.soundVolume = clampVolume((+btn.value) / 100);
    save();
    const lab = document.querySelector("[data-vol-label]");
    if (lab) lab.textContent = `${Math.round(state.soundVolume * 100)}%`;
  }
  else if (act==="dismiss-hold") dismissBalanceHold();
  else if (act==="save-bw") saveBodyWeight();
  else if (act==="skip-bw") skipBodyWeight();
  else if (act==="bw-step") bumpBodyWeight(+btn.dataset.d);
  else if (act==="log-bw-now") openBodyWeightPrompt(false);
  else if (act==="install") {
    if (location.protocol === "file:") {
      ui.installHint = true;
      toast("Use the web link", "Open ANVIL in Chrome or Safari from the link, then tap Install. A downloaded file won’t stay on the home screen.");
      render();
    } else if (deferredInstall) {
      deferredInstall.prompt();
      deferredInstall.userChoice.then((r) => {
        if (r.outcome === "accepted") { deferredInstall = null; ui.installed = true; }
        render();
      });
    } else {
      ui.installHint = true;
      toast("Add to Home screen", "iPhone: Share → Add to Home Screen. Android: Chrome menu → Add to Home screen.");
      render();
    }
  }
});

try {
  load();
  loadWalks();
  if (normalizeWaveTargets()) save();
  render();
} catch {
  try { localStorage.removeItem(STORAGE); } catch {}
  state = { programId:"anvil", dayIndex:0, exercises: seedProgram("anvil", 0), history:[], liftProgress:{}, bodyWeightLog:[], soundVolume:1.0, cuePack:"chime", loudCuesV33:true };
  try { loadWalks(); } catch {}
  try { render(); } catch {}
}
try { loadSync(); setTimeout(syncIfStale, 2500); } catch {}
if (location.protocol.startsWith("http") && "serviceWorker" in navigator) {
  function watchInstalling(worker){
    if (!worker) return;
    worker.addEventListener("statechange", () => {
      if (worker.state === "installed" && navigator.serviceWorker.controller) {
        ui.updateReady = true;
        render();
      }
    });
  }
  navigator.serviceWorker.addEventListener("controllerchange", () => {
    if (ui.refreshing) location.reload();
  });
  navigator.serviceWorker.register(new URL("sw.js", location.href).href).then((reg) => {
    ui.swReg = reg;
    try { reg.update(); } catch {}
    reg.addEventListener("updatefound", () => watchInstalling(reg.installing));
    if (reg.waiting && navigator.serviceWorker.controller) {
      ui.updateReady = true;
      render();
    }
    watchInstalling(reg.installing);
  }).catch(() => {});
  const pokeUpdate = () => {
    if (document.visibilityState !== "visible") return;
    const reg = ui.swReg;
    if (reg && typeof reg.update === "function") {
      try { reg.update(); } catch {}
    }
  };
  document.addEventListener("visibilitychange", pokeUpdate);
  window.addEventListener("focus", pokeUpdate);
  setInterval(pokeUpdate, 60 * 60 * 1000);
}
</script>
</body>
